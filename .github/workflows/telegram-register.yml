name: Register Telegram webhook

# `diagnose` is read-only. `repair` rotates the webhook secret, preserves the
# current allowlist, refuses a known non-empty queue, does not explicitly drop
# pending updates, and sets the read-only command menu. It never infers an owner
# from an unsolicited private message.
# A confirmed repair is a production operation, restricted to reviewed main.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type REGISTER_TELEGRAM_WEBHOOK to confirm"
        required: true
        type: string
      mode:
        description: "Read-only diagnostics or repair existing configuration"
        required: true
        type: choice
        default: diagnose
        options:
          - diagnose
          - repair
      owner_binding:
        description: "Repair only: attest independently verified exclusive allowlist (see runbook)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: telegram-webhook-registration
  cancel-in-progress: false

env:
  WEBHOOK_URL: https://raawaa-autonomous-engine-control.ghith-shikhkhaled.workers.dev/v1/telegram/webhook
  EXPECTED_BOT: Raawaa_control_bot

jobs:
  register:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'REGISTER_TELEGRAM_WEBHOOK'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Require independent allowlist verification for repair
        if: inputs.mode == 'repair'
        env:
          OWNER_BINDING: ${{ inputs.owner_binding }}
        run: |
          set -euo pipefail
          if [ "${OWNER_BINDING:-}" != 'VERIFIED_EXISTING_ALLOWLIST' ]; then
            echo '::error title=Owner authorization unverified::Repair requires independent verification of every existing allowed identity. Presence is not proof. See the runbook.'
            exit 1
          fi
          echo '::notice title=Owner verification::Operator attestation received; the workflow cannot independently verify the allowlist.'
      - name: Validate required repository secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for name in TELEGRAM_BOT_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing repository secret::$name is not configured."
              exit 1
            fi
          done
      - name: Inspect bot and Telegram webhook without changing them
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if output=$(python3 scripts/telegram_bootstrap.py --diagnose --url "$WEBHOOK_URL" --expected-bot "$EXPECTED_BOT" 2>&1); then
            printf '%s\n' "$output" > /tmp/telegram-diagnostic.json
          else
            echo "::error title=Telegram diagnostics::$output"
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          data = json.load(open('/tmp/telegram-diagnostic.json', encoding='utf-8'))
          message = (f"bot={data['bot']}, webhook_matches={data['webhook_matches']}, "
                     f"pending_updates={data['pending_updates']}, last_delivery_error={data['last_delivery_error']}; "
                     "webhook secret and owner authorization are unknown")
          print(f"::notice title=Telegram diagnostics::{message}")
          if os.environ['MODE'] == 'repair' and data['pending_updates']:
              print('::error title=Pending updates::Repair refuses to redirect a known non-empty queue; investigate before changing production.')
              raise SystemExit(1)
          PY
      - name: Check unsigned Worker configuration gate without sending a message
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if output=$(python3 scripts/telegram_bootstrap.py --probe-unsigned --url "$WEBHOOK_URL" 2>&1); then
            echo "::notice title=Worker readiness::Unsigned request rejected with HTTP 401; configuration is structurally valid at this edge, but owner authorization is unknown."
          elif [ "$MODE" = repair ]; then
            echo "::error title=Worker readiness::$output"
            exit 1
          else
            echo "::warning title=Worker readiness::$output"
          fi
      - name: Check Worker allowlist secret presence only
        id: worker_secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if ! npx --yes wrangler@4.156.1 secret list --format json --config wrangler.toml > /tmp/telegram-worker-secrets.json 2>/dev/null; then
            echo "::error title=Worker secret inventory::Unable to list Worker secret names. No secret value was requested."
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          items = json.load(open('/tmp/telegram-worker-secrets.json', encoding='utf-8'))
          if not isinstance(items, list):
              raise SystemExit('Unexpected Worker secret inventory shape')
          present = any(isinstance(item, dict) and item.get('name') == 'TELEGRAM_ALLOWED_CHAT_IDS' for item in items)
          print(f'::notice title=Worker allowlist::secret_present={str(present).lower()}; value and owner identity were not read')
          if not present and os.environ['MODE'] == 'repair':
              print('::error title=Owner authorization missing::Repair will not guess an allowed chat or replace an absent allowlist.')
              raise SystemExit(1)
          PY
      - name: Inspect aggregate Telegram receipt counts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if ! npx --yes wrangler@4.156.1 d1 execute raawaa-autonomous-e --remote --config wrangler.toml --json \
            --command "SELECT COUNT(*) AS total, COALESCE(SUM(CASE WHEN delivery_status='sent' THEN 1 ELSE 0 END),0) AS sent FROM telegram_update_receipts" \
            > /tmp/telegram-receipt-counts.json 2>/dev/null; then
            echo "::warning title=Receipt counts unavailable::D1 aggregate read failed; no identifiers or messages were requested."
            exit 0
          fi
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/telegram-receipt-counts.json', encoding='utf-8'))
          result = data[0] if isinstance(data, list) and data else data
          rows = result.get('results', []) if isinstance(result, dict) else []
          if not rows or not isinstance(rows[0], dict):
              print('::warning title=Receipt counts unavailable::Unexpected D1 response shape')
          else:
              total, sent = rows[0].get('total'), rows[0].get('sent')
              if not all(isinstance(n, int) and not isinstance(n, bool) and n >= 0 for n in (total, sent)):
                  raise SystemExit('Invalid aggregate receipt counts')
              print(f'::notice title=Telegram receipts::total={total}, sent={sent}; aggregates do not prove the owner identity')
          PY
      - name: Configure and verify read-only command menu
        if: inputs.mode == 'repair'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if output=$(python3 scripts/telegram_bootstrap.py --configure-commands --expected-bot "$EXPECTED_BOT" 2>&1); then
            echo "::notice title=Telegram commands::Menu read back successfully: /start, /help, /status, /report. No messages sent."
          else
            echo "::error title=Telegram command setup::$output"
            exit 1
          fi
      - name: Prepare a new webhook secret without changing Telegram
        if: inputs.mode == 'repair'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if output=$(python3 scripts/telegram_bootstrap.py --rearm-only --url "$WEBHOOK_URL" \
            --expected-bot "$EXPECTED_BOT" --env-file /tmp/telegram.env 2>&1); then
            echo "::notice title=Preparation::Prepared private file; existing allowlist remains untouched."
          else
            echo "::error title=Telegram preparation::$output"
            exit 1
          fi
          masked=0
          while IFS='=' read -r key value; do
            if [ "$key" = TELEGRAM_WEBHOOK_SECRET ]; then
              [[ "$value" =~ ^[A-Za-z0-9_-]{16,256}$ ]] || { echo '::error::Invalid prepared webhook secret'; exit 1; }
              printf '::add-mask::%s\n' "$value"
              masked=$((masked + 1))
            fi
          done < /tmp/telegram.env
          [ "$masked" -eq 1 ] || { echo '::error::Expected exactly one prepared webhook secret'; exit 1; }
      - name: Install bot and webhook secrets; preserve the allowlist
        if: inputs.mode == 'repair'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          while IFS='=' read -r key value; do
            case "$key" in
              TELEGRAM_BOT_TOKEN|TELEGRAM_WEBHOOK_SECRET) ;;
              TELEGRAM_ALLOWED_CHAT_IDS)
                [ -z "$value" ] || { echo "::error::Unexpected allowlist change in rearm mode"; exit 1; }
                continue ;;
              *) echo "::error::Unexpected prepared key"; exit 1 ;;
            esac
            [ -n "$value" ] || { echo "::error::Empty prepared secret"; exit 1; }
            # Provider output is deliberately discarded: it could echo submitted
            # data on error. GitHub masks the new webhook secret as a second line
            # of defense, but transformed values would not necessarily be masked.
            if printf '%s' "$value" | npx --yes wrangler@4.156.1 secret put "$key" --config wrangler.toml >/dev/null 2>&1; then
              echo "::notice title=Worker secret::Installed $key."
            else
              echo "::error title=Worker secret::Installation of $key failed; provider output withheld to protect secrets."
              exit 1
            fi
          done < /tmp/telegram.env
      - name: Register and verify the exact webhook URL
        if: inputs.mode == 'repair'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if output=$(python3 scripts/telegram_bootstrap.py --register-prepared --url "$WEBHOOK_URL" \
            --expected-bot "$EXPECTED_BOT" --env-file /tmp/telegram.env 2>&1); then
            echo "::notice title=Telegram webhook::Exact destination verified; pending updates were not explicitly dropped."
          else
            echo "::error title=Telegram registration::$output"
            exit 1
          fi
      - name: Verify a signed ignored update without sending a message
        if: inputs.mode == 'repair'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if output=$(python3 scripts/telegram_bootstrap.py --probe-prepared --url "$WEBHOOK_URL" \
            --env-file /tmp/telegram.env 2>&1); then
            echo "::notice title=Worker probe::HTTP 200 and exact ignored response; owner authorization and delivery remain unverified."
          else
            echo "::error title=Worker probe::$output"
            exit 1
          fi
      - name: Summary
        if: always()
        env:
          MODE: ${{ inputs.mode }}
        run: |
          {
            echo "### Telegram $MODE"
            echo ""
            echo "A matching URL or a signed synthetic probe does not prove the owner's chat is authorized or that a reply was delivered."
            echo "Repair preserves the existing allowlist and does not explicitly drop pending updates."
            echo "The operator attestation is not automated verification of owner identity."
            echo "If a repair fails between secret installation and registration, investigate the failure and pending queue before considering a fresh matching secret."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove prepared secrets
        if: always()
        run: rm -f /tmp/telegram.env
