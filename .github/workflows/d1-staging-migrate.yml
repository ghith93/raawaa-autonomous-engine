name: Apply D1 Migrations to Staging

on:
  workflow_run:
    workflows: ["Engine CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: d1-staging-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact main commit that passed Engine CI
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate staging and production database separation
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("wrangler.staging.toml").open("rb") as stream:
              staging = tomllib.load(stream)
          with Path("wrangler.toml").open("rb") as stream:
              production = tomllib.load(stream)

          expected_id = "231dd948-04a0-49e3-ad73-444f77d69477"
          expected_name = "raawaa-engine-staging"
          bindings = staging.get("d1_databases", [])
          if len(bindings) != 1:
              raise SystemExit("Refusing staging migration: expected exactly one D1 binding")
          binding = bindings[0]
          if binding.get("binding") != "DB" or binding.get("database_name") != expected_name or binding.get("database_id") != expected_id:
              raise SystemExit("Refusing staging migration: staging D1 identity did not match the approved target")
          production_ids = {item.get("database_id") for item in production.get("d1_databases", [])}
          if expected_id in production_ids:
              raise SystemExit("Refusing staging migration: staging ID is also configured in production")
          if any(item.get("database_name") == expected_name for item in production.get("d1_databases", [])):
              raise SystemExit("Refusing staging migration: staging database name appears in production config")
          print("Staging target verified; production D1 identity is separate.")
          PY
      - name: Show pending staging migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.156.1 d1 migrations list raawaa-engine-staging --remote --config wrangler.staging.toml
      - name: Apply pending migrations to staging only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.156.1 d1 migrations apply raawaa-engine-staging --remote --config wrangler.staging.toml
      - name: Verify staging migration state after apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.156.1 d1 migrations list raawaa-engine-staging --remote --config wrangler.staging.toml
