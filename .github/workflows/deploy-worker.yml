name: Deploy Control Worker

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: 'Type DEPLOY_CONTROL_WORKER to authorize a production Worker deployment'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: control-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@v4
      - name: Require explicit deployment confirmation
        env:
          CONFIRM_DEPLOYMENT: ${{ inputs.confirm_deployment }}
        run: |
          test "$CONFIRM_DEPLOYMENT" = "DEPLOY_CONTROL_WORKER" || {
            echo "Deployment confirmation did not match; refusing to deploy."
            exit 1
          }
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENGINE_API_TOKEN: ${{ secrets.ENGINE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$ENGINE_API_TOKEN" || { echo "Missing ENGINE_API_TOKEN; add a dedicated application token as a GitHub Actions secret."; exit 1; }
      - name: Install application bearer token as Worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENGINE_API_TOKEN: ${{ secrets.ENGINE_API_TOKEN }}
        run: printf '%s' "$ENGINE_API_TOKEN" | npx --yes wrangler@4 secret put ENGINE_API_TOKEN --config wrangler.toml
      - name: Deploy authenticated D1 control Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml
