name: Deploy Control Worker

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: 'Type DEPLOY_CONTROL_WORKER to authorize a production Worker deployment'
        required: true
        type: string
  workflow_run:
    workflows: ["Engine CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: control-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # API-first, browser-free dispatch: only a successful Engine CI push to main
    # whose squash-merge commit message contains the explicit deployment marker.
    # PR CI, ordinary main pushes, and failed CI runs cannot deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        contains(github.event.workflow_run.head_commit.message, '[deploy-control-worker]')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reviewed main revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Require explicit deployment confirmation
        env:
          CONFIRM_DEPLOYMENT: ${{ inputs.confirm_deployment || (github.event_name == 'workflow_run' && contains(github.event.workflow_run.head_commit.message, '[deploy-control-worker]') && 'DEPLOY_CONTROL_WORKER') }}
        run: |
          test "$CONFIRM_DEPLOYMENT" = "DEPLOY_CONTROL_WORKER" || {
            echo "Deployment confirmation did not match; refusing to deploy."
            exit 1
          }
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENGINE_API_TOKEN: ${{ secrets.ENGINE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$ENGINE_API_TOKEN" || { echo "Missing ENGINE_API_TOKEN; add a dedicated application token as a GitHub Actions secret."; exit 1; }
      - name: Install application bearer token as Worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENGINE_API_TOKEN: ${{ secrets.ENGINE_API_TOKEN }}
        run: printf '%s' "$ENGINE_API_TOKEN" | npx --yes wrangler@4 secret put ENGINE_API_TOKEN --config wrangler.toml
      - name: Deploy authenticated D1 control Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml
