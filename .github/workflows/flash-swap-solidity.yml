name: V2 Flash Swap Solidity Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "projects/telegram-arbitrage-engine/solidity-test/**"
      - ".github/workflows/flash-swap-solidity.yml"
  push:
    branches: [main]
    paths:
      - "projects/telegram-arbitrage-engine/solidity-test/**"
      - ".github/workflows/flash-swap-solidity.yml"

permissions:
  contents: read

concurrency:
  group: flash-swap-solidity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundry-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: projects/telegram-arbitrage-engine/solidity-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.8.7
      - name: Run local mock-pair EVM tests
        run: forge test --match-path test/FlashSwapHarness.t.sol -vvv
