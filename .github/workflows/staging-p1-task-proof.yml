name: Staging P1 end-to-end task proof (manual)

# Manual evidence run only. This workflow intentionally has NO schedule
# trigger and its result NEVER counts toward the Runtime-004 requirement of
# two distinct successful genuine `event=schedule` probe runs.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Share the lock with CI and the scheduled probe because all of them
  # install and revoke the same temporary Staging Worker bearer-token secret.
  group: d1-staging-worker-verification
  cancel-in-progress: false

jobs:
  p1-proof:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Validate isolated Staging identity and fail-closed defaults
        run: |
          python -m engine.cli audit
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          with Path("wrangler.staging.toml").open("rb") as stream:
              staging = tomllib.load(stream)
          with Path("wrangler.toml").open("rb") as stream:
              production = tomllib.load(stream)
          stage_d1 = staging.get("d1_databases", [])
          prod_d1 = production.get("d1_databases", [])
          if (staging.get("name") != "raawaa-autonomous-engine-staging"
                  or staging.get("workers_dev") is not True
                  or staging.get("routes") or staging.get("route")):
              raise SystemExit("Refusing P1 proof: Staging Worker is not isolated on workers.dev")
          if (len(stage_d1) != 1 or len(prod_d1) != 1
                  or stage_d1[0].get("database_name") != "raawaa-engine-staging"
                  or stage_d1[0].get("database_id") != "231dd948-04a0-49e3-ad73-444f77d69477"
                  or prod_d1[0].get("database_id") != "f0ffbed3-940f-488d-a7d1-31cbc5fbf742"
                  or stage_d1[0].get("database_id") == prod_d1[0].get("database_id")):
              raise SystemExit("Refusing P1 proof: Staging and Production D1 identities differ from reviewed targets")
          policy = json.loads(Path("config/policy.json").read_text(encoding="utf-8"))
          routes = json.loads(Path("config/provider_profiles.json").read_text(encoding="utf-8"))["routes"]
          if (policy.get("mode") != "safe_dry_run"
                  or policy.get("allow_paid_model_calls") is not False
                  or policy.get("allow_external_writes") is not False
                  or any(route.get("enabled") for route in routes)):
              raise SystemExit("Refusing P1 proof: repository defaults are not fail-closed")
          print("Staging Worker/D1 identities and zero-provider defaults verified.")
          PY
      - name: Install pinned Wrangler CLI without credentials
        run: npx --yes wrangler@4.156.1 --version
      - name: Generate an ephemeral Staging-only bearer token
        shell: bash
        run: |
          set -euo pipefail
          STAGING_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          echo "::add-mask::$STAGING_TOKEN"
          echo "RAAWAA_ENGINE_STAGING_API_TOKEN=$STAGING_TOKEN" >> "$GITHUB_ENV"
          echo "RAAWAA_ENGINE_API_TOKEN=$STAGING_TOKEN" >> "$GITHUB_ENV"
      - name: Install temporary token on the isolated Staging Worker
        id: install_staging_token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$RAAWAA_ENGINE_STAGING_API_TOKEN" || { echo "Missing ephemeral Staging token"; exit 1; }
          printf '%s' "$RAAWAA_ENGINE_STAGING_API_TOKEN" | npx --yes wrangler@4.156.1 secret put ENGINE_API_TOKEN --config wrangler.staging.toml
      - name: Enqueue, claim, execute, and read back exactly one harmless task
        env:
          RAAWAA_ENGINE_API_URL: https://raawaa-autonomous-engine-staging.ghith-shikhkhaled.workers.dev
          RAAWAA_ENGINE_PROCESS_SUPERVISOR: enabled
          RAAWAA_ENGINE_LIVE_INFERENCE: disabled
          RAAWAA_ENGINE_STAGING_TOKEN_INSTALLED: "true"
        run: python scripts/run_staging_p1_task_proof.py
      - name: Revoke temporary Staging bearer token
        if: ${{ always() && steps.install_staging_token.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.156.1 secret delete ENGINE_API_TOKEN --config wrangler.staging.toml
