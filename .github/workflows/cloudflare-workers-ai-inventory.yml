name: Cloudflare Workers AI Read-only Catalog Check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-workers-ai-inventory.yml"
      - "docs/provider-free-tier-eligibility.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-catalog:
    name: Verify Workers AI read permission and public model catalog
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate Cloudflare credentials without exposing values
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing."; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing."; exit 1; }
          echo "Required secret names are present; values are withheld."

      - name: Read the exact Gemma 4 model catalog entry (no inference)
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          account = urllib.parse.quote(os.environ["CLOUDFLARE_ACCOUNT_ID"], safe="")
          query = urllib.parse.urlencode({
              "search": "gemma-4-26b-a4b-it",
              "per_page": "20",
              "hide_experimental": "true",
          })
          url = f"https://api.cloudflare.com/client/v4/accounts/{account}/ai/models/search?{query}"
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"],
                  "Accept": "application/json",
                  "User-Agent": "RaawaaWorkersAIReadOnlyInventory/1.0",
              },
              method="GET",
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  status = response.status
                  payload = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as error:
              print(f"Workers AI model-catalog read returned HTTP {error.code}.")
              if error.code in (401, 403):
                  print("The existing Cloudflare API token likely lacks Account > Workers AI > Read (or Workers AI > Write).")
              print("inference_requests=0; mutations=0; account_plan=unverified.")
              raise SystemExit(1)
          except (urllib.error.URLError, TimeoutError, OSError, ValueError):
              print("Workers AI model-catalog read failed; response details withheld.")
              print("inference_requests=0; mutations=0; account_plan=unverified.")
              raise SystemExit(1)

          if not isinstance(payload, dict) or payload.get("success") is not True:
              print("Cloudflare did not return a successful model-catalog response; details withheld.")
              print("inference_requests=0; mutations=0; account_plan=unverified.")
              raise SystemExit(1)

          result = payload.get("result")
          if not isinstance(result, list):
              print("Cloudflare model-catalog response had an unexpected shape.")
              raise SystemExit(1)

          candidate_slug = "gemma-4-26b-a4b-it"
          visible = candidate_slug in json.dumps(result, ensure_ascii=True)
          print(f"Workers AI catalog API: HTTP {status}; read_permission=verified.")
          print(f"Candidate present in returned catalog page: {str(visible).lower()}.")
          print("inference_requests=0; mutations=0; account_plan=unverified; account_entitlement=unverified.")
          print("This read proves API permission and catalog visibility only; it does not prove account plan, billing hard-stop, or inference entitlement.")

          if not visible:
              raise SystemExit("The pinned Gemma 4 candidate was not present in the returned catalog page.")
          PY
