name: Engine Maintenance

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: engine-maintenance
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Validate engine configuration
        run: python -m engine.cli audit
      - name: Run complete test suite
        run: python -m unittest discover -s tests -v

      # The development loop's read half. It ranks work; it cannot do work:
      # no merge, deploy, migration, provider activation or spend is reachable
      # from here, and the ranking is published, not acted on.
      - name: Rank the next development actions (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/build_development_state.py --out /tmp/development-state.json
          python -m engine.cli dev-cycle --state /tmp/development-state.json --format markdown >> "$GITHUB_STEP_SUMMARY"
          python -m engine.cli dev-cycle --state /tmp/development-state.json > /tmp/development-cycle.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: development-cycle
          path: |
            /tmp/development-state.json
            /tmp/development-cycle.json
          retention-days: 14
