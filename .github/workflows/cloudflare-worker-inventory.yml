name: Cloudflare Worker Inventory

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-worker-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: cloudflare-worker-inventory
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify Cloudflare credentials are present without exposing them
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing."; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing."; exit 1; }
          echo "Cloudflare API token and account ID are present (values withheld)."

      - name: Read-only Cloudflare Worker inventory
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_WORKER: raawaa-autonomous-engine-control
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          account = os.environ["CF_ACCOUNT_ID"]
          token = os.environ["CF_API_TOKEN"]
          expected = os.environ["EXPECTED_WORKER"]
          url = f"https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts?per_page=1000&page=1"
          request = urllib.request.Request(
              url,
              headers={"Authorization": f"Bearer {token}", "Accept": "application/json"},
              method="GET",
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  status = response.status
                  payload = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as error:
              print(f"Cloudflare Workers inventory API returned HTTP {error.code}.")
              print("The token may be missing Workers Scripts Read/Write permission, or the account ID may not match.")
              sys.exit(1)
          except (urllib.error.URLError, TimeoutError, OSError, ValueError) as error:
              print(f"Cloudflare inventory request failed: {type(error).__name__}.")
              sys.exit(1)

          if not payload.get("success"):
              codes = [str(item.get("code", "unknown")) for item in payload.get("errors", [])]
              print("Cloudflare API did not report success. Error codes: " + (", ".join(codes) or "not supplied"))
              sys.exit(1)

          scripts = payload.get("result") or []
          matches = [item for item in scripts if item.get("id") == expected]
          print(f"Cloudflare API inventory request: HTTP {status}; success=true.")
          print(f"Worker scripts returned on page 1: {len(scripts)}.")
          if matches:
              item = matches[0]
              print("EXPECTED_WORKER_DEPLOYED=true")
              print(f"Worker name: {item.get('id', expected)}")
              print(f"Created: {item.get('created_on', 'not reported')}")
              print(f"Modified: {item.get('modified_on', 'not reported')}")
          else:
              print("EXPECTED_WORKER_DEPLOYED=false")
              print(f"No deployed Worker named {expected} was found on the first inventory page.")
              sys.exit(2)
          PY

      - name: Inspect workers.dev route configuration (read-only)
        id: subdomain
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_WORKER: raawaa-autonomous-engine-control
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("enabled=unknown\npreviews=unknown\n")
          account = urllib.parse.quote(os.environ["CF_ACCOUNT_ID"], safe="")
          worker = urllib.parse.quote(os.environ["EXPECTED_WORKER"], safe="")
          url = f"https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/{worker}/subdomain"
          request = urllib.request.Request(
              url,
              headers={"Authorization": "Bearer " + os.environ["CF_API_TOKEN"],
                       "Accept": "application/json"},
              method="GET",
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.loads(response.read().decode("utf-8"))
                  print(f"Worker subdomain API: HTTP {response.status}.")
          except urllib.error.HTTPError as error:
              print(f"Worker subdomain API: HTTP {error.code}.")
              print(f"CF-RAY: {error.headers.get('CF-RAY', 'not supplied')}")
              raise SystemExit(0)
          except (urllib.error.URLError, TimeoutError, OSError, ValueError) as error:
              print(f"Worker subdomain inspection failed: {type(error).__name__}.")
              raise SystemExit(0)

          if not payload.get("success"):
              codes = [str(item.get("code", "unknown")) for item in payload.get("errors", [])]
              print("Worker subdomain API did not report success; error codes: " +
                    (", ".join(codes) or "not supplied"))
              raise SystemExit(0)

          result = payload.get("result") or {}
          enabled_value = result.get("enabled")
          previews_value = result.get("previews_enabled")
          enabled = str(enabled_value).lower() if isinstance(enabled_value, bool) else "unknown"
          previews = str(previews_value).lower() if isinstance(previews_value, bool) else "unknown"
          print(f"WORKERS_DEV_ENABLED={enabled}")
          print(f"WORKER_PREVIEWS_ENABLED={previews}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"enabled={enabled}\npreviews={previews}\n")

      - name: Check the public Worker health endpoint
        id: health
        if: success() || failure()
        env:
          WORKER_URL: https://raawaa-autonomous-engine-control.ghith-shikhkhaled.workers.dev
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          def write_output(name, value):
              value = " ".join(str(value or "unknown").split())[:240]
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write(f"{name}={value}\n")

          write_output("status", "unknown")
          write_output("ray", "not_supplied")
          write_output("detail", "not_available")
          headers = {
              "Accept": "application/json",
              "User-Agent": "RaawaaAutonomousEngine/1.0 (+https://github.com/ghith93/raawaa-autonomous-engine)",
          }
          client_id = os.environ.get("CF_ACCESS_CLIENT_ID", "")
          client_secret = os.environ.get("CF_ACCESS_CLIENT_SECRET", "")
          if bool(client_id) != bool(client_secret):
              print("Cloudflare Access service-token secrets are only partially configured.")
              raise SystemExit(1)
          if client_id:
              headers["CF-Access-Client-Id"] = client_id
              headers["CF-Access-Client-Secret"] = client_secret

          request = urllib.request.Request(os.environ["WORKER_URL"].rstrip("/") + "/health", headers=headers)
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  body = response.read(4096).decode("utf-8", errors="replace")
                  print(f"Worker /health: HTTP {response.status}.")
                  write_output("status", response.status)
                  write_output("ray", response.headers.get("CF-Ray", "not_supplied"))
                  write_output("detail", "success response")
                  print("Response body withheld.")
          except urllib.error.HTTPError as error:
              raw = error.read(4096).decode("utf-8", errors="replace")
              print(f"Worker /health: HTTP {error.code}.")
              ray = error.headers.get("CF-Ray", "not_supplied")
              print(f"CF-Ray: {ray}")
              write_output("status", error.code)
              write_output("ray", ray)
              detail = "non-JSON response"
              try:
                  payload = json.loads(raw)
                  errors = payload.get("errors") or []
                  if errors:
                      detail = "; ".join(
                          f"{item.get('code', 'unknown')}: {item.get('message', 'no message')}"
                          for item in errors[:3]
                      )
                  elif isinstance(payload, dict):
                      allowed = {"error", "message", "code", "success", "status", "detail"}
                      safe_fields = {
                          key: value for key, value in payload.items()
                          if key in allowed and isinstance(value, (str, int, float, bool))
                      }
                      detail = json.dumps(safe_fields, sort_keys=True) if safe_fields else (
                          "JSON response keys: " + ", ".join(sorted(str(key)[:60] for key in payload)[:12])
                      )
                  else:
                      detail = "JSON response was not an object"
              except ValueError:
                  match = re.search(r"<title[^>]*>(.*?)</title>", raw, re.IGNORECASE | re.DOTALL)
                  if match:
                      detail = "HTML title: " + re.sub(r"\s+", " ", match.group(1))
              for secret_name in ("CF_ACCESS_CLIENT_ID", "CF_ACCESS_CLIENT_SECRET"):
                  secret = os.environ.get(secret_name, "")
                  if secret:
                      detail = detail.replace(secret, "[REDACTED]")
              write_output("detail", detail)
              print(f"Response detail: {' '.join(detail.split())[:240]}")
              for name in ("cf-mitigated", "server", "content-type"):
                  value = error.headers.get(name)
                  if value:
                      print(f"{name}: {value}")
          except (urllib.error.URLError, TimeoutError, OSError) as error:
              print(f"Worker /health request failed: {type(error).__name__}.")
              write_output("status", "request_failed")
              write_output("detail", type(error).__name__)
          PY
      - name: Publish workers.dev route status to tracking issue
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          WORKERS_DEV_ENABLED: ${{ steps.subdomain.outputs.enabled }}
          WORKER_PREVIEWS_ENABLED: ${{ steps.subdomain.outputs.previews }}
          WORKER_HEALTH_STATUS: ${{ steps.health.outputs.status }}
          WORKER_HEALTH_RAY: ${{ steps.health.outputs.ray }}
          WORKER_HEALTH_DETAIL: ${{ steps.health.outputs.detail }}
        with:
          script: |
            const body = "## Worker route diagnostic\n\n" +
              "Run: " + context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId + "\n\n" +
              "workers.dev enabled: `" + (process.env.WORKERS_DEV_ENABLED || "unknown") + "`\n" +
              "Preview URLs enabled: `" + (process.env.WORKER_PREVIEWS_ENABLED || "unknown") + "`\n" +
              "Health status: `" + (process.env.WORKER_HEALTH_STATUS || "unknown") + "`\n" +
              "Health Ray ID: `" + (process.env.WORKER_HEALTH_RAY || "not supplied") + "`\n" +
              "Sanitized response detail: " + (process.env.WORKER_HEALTH_DETAIL || "not available") + "\n\n" +
              "Read-only inspection; no Cloudflare settings were changed.";
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 34, body });
