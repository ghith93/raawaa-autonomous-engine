name: Coding Agent CLI Installation Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/coding-agent-cli-smoke.yml"
      - ".devcontainer/**"
      - "docs/coding-agent-cli-readiness.md"
      - "docs/coding-agent-codespaces.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coding-agent-cli-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-and-version-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Validate Codespaces bootstrap script
        run: bash -n .devcontainer/post-create.sh

      - name: Install coding-agent CLIs using the Codespaces bootstrap script
        shell: bash
        run: bash .devcontainer/post-create.sh
