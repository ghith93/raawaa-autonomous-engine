name: D1 Staging Inventory (Read Only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wrangler.staging.toml'
      - 'migrations/**'
      - '.github/workflows/d1-staging-inventory.yml'

permissions:
  contents: read

concurrency:
  group: d1-staging-inventory
  cancel-in-progress: false

jobs:
  inventory:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Verify staging D1 API connectivity (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: "231dd948-04a0-49e3-ad73-444f77d69477"
        run: python -c "from engine.d1_client import D1Client; print(D1Client().healthcheck())"
      - name: List staging migration state (read-only; never applies migrations)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.156.1 d1 migrations list raawaa-engine-staging --remote --config wrangler.staging.toml
