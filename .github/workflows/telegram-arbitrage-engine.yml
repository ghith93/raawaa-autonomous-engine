name: Telegram Arbitrage Engine CI

on:
  push:
    branches: [main]
    paths:
      - "projects/telegram-arbitrage-engine/**"
      - ".github/workflows/telegram-arbitrage-engine.yml"
  pull_request:
    branches: [main]
    paths:
      - "projects/telegram-arbitrage-engine/**"
      - ".github/workflows/telegram-arbitrage-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-arbitrage-engine-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: projects/telegram-arbitrage-engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test tooling
        run: python -m pip install --disable-pip-version-check pytest ruff
      - name: Install isolated package
        run: python -m pip install --no-deps -e .
      - name: Run tests
        run: pytest
      - name: Lint
        run: ruff check --select E4,E7,E9,F src tests
      - name: Compile
        run: python -m compileall -q src tests

  live-venue-smoke:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: projects/telegram-arbitrage-engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install isolated package
        run: python -m pip install --disable-pip-version-check --no-deps -e .
      - name: Verify source-documented Ethereum V2 deployments (read-only)
        run: |
          set -euo pipefail
          verified=0
          for endpoint in https://ethereum-rpc.publicnode.com https://eth.nodely.dev https://ethereum.publicnode.com; do
            echo "Trying read-only Ethereum RPC provider: $endpoint"
            if arb-engine venue-check --chain-id 1 --rpc-url "$endpoint" --timeout-seconds 8; then
              verified=1
              break
            fi
          done
          if [ "$verified" -ne 1 ]; then
            echo "All configured Ethereum RPC providers failed the read-only venue check"
            exit 1
          fi
      - name: Verify live WETH-USDC cross-venue scanner (read-only)
        env:
          WETH_MAINNET: "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2"
          USDC_MAINNET: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
        run: |
          set -euo pipefail
          result="$(arb-engine onchain-v2-scan --token-address "$WETH_MAINNET" --quote-token-address "$USDC_MAINNET" --capital-quote 1000 --rpc-url https://eth.nodely.dev --max-candidate-pairs 4 --max-rpc-requests 32 --min-request-interval 0.55)"
          printf '%s\n' "$result"
          python -c 'import json,sys; d=json.loads(sys.stdin.read()); assert d["status"] == "quoted", d; assert d["chain_id"] == 1; assert len(d["routes"]) == 2; assert d["gas_included"] is False and d["net_profit_claim"] is False; assert d["transaction_submitted"] is False; assert len(d["block_hash"]) == 66' <<< "$result"

  anvil-fork-smoke:
    if: github.event_name != 'pull_request'
    needs: live-venue-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/telegram-arbitrage-engine/solidity-test
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.7
      - name: Select a public RPC with pinned-hash state support
        id: fork
        env:
          RPC_ENDPOINTS: "https://eth.drpc.org https://public.1rpc.io/eth https://eth.nodely.dev https://ethereum-rpc.publicnode.com"
          UNISWAP_FACTORY: "0x5C69bEe701ef814a2B6a3EDD4B1652CB9cc5aA6f"
        run: |
          set -euo pipefail
          selected=""
          for endpoint in $RPC_ENDPOINTS; do
            echo "Probing public Ethereum RPC for EIP-1898 state support: $endpoint"
            finalized="$(curl --fail --silent --show-error --max-time 8 -H "Content-Type: application/json" --data '{"jsonrpc":"2.0","id":1,"method":"eth_getBlockByNumber","params":["finalized",false]}' "$endpoint" 2>/dev/null || true)"
            block_json="$finalized"
            block_hex="$(jq -r '.result.number // empty' <<< "$block_json" 2>/dev/null || true)"
            if ! [[ "$block_hex" =~ ^0x[0-9a-fA-F]+$ ]]; then
              latest="$(curl --fail --silent --show-error --max-time 8 -H "Content-Type: application/json" --data '{"jsonrpc":"2.0","id":2,"method":"eth_blockNumber","params":[]}' "$endpoint" 2>/dev/null || true)"
              latest_hex="$(jq -r '.result // empty' <<< "$latest" 2>/dev/null || true)"
              if ! [[ "$latest_hex" =~ ^0x[0-9a-fA-F]+$ ]]; then
                echo "Provider did not return a usable block number."
                continue
              fi
              latest_digits="$(printf '%s' "$latest_hex" | sed 's/^0x//')"
              latest_number="$((16#$latest_digits))"
              if [ "$latest_number" -le 64 ]; then
                echo "Provider returned an implausibly low latest block."
                continue
              fi
              block_hex="$(printf '0x%x' "$((latest_number - 64))")"
              block_json="$(curl --fail --silent --show-error --max-time 8 -H "Content-Type: application/json" --data "{\"jsonrpc\":\"2.0\",\"id\":3,\"method\":\"eth_getBlockByNumber\",\"params\":[\"$block_hex\",false]}" "$endpoint" 2>/dev/null || true)"
            fi
            block_hex="$(jq -r '.result.number // empty' <<< "$block_json" 2>/dev/null || true)"
            block_hash="$(jq -r '.result.hash // empty' <<< "$block_json" 2>/dev/null || true)"
            parent_hash="$(jq -r '.result.parentHash // empty' <<< "$block_json" 2>/dev/null || true)"
            if ! [[ "$block_hex" =~ ^0x[0-9a-fA-F]+$ && "$block_hash" =~ ^0x[0-9a-fA-F]{64}$ && "$parent_hash" =~ ^0x[0-9a-fA-F]{64}$ ]]; then
              echo "Provider did not return a complete pinned block."
              continue
            fi
            probe="$(jq -nc --arg address "$UNISWAP_FACTORY" --arg hash "$block_hash" '{jsonrpc:"2.0",id:4,method:"eth_getCode",params:[$address,{blockHash:$hash,requireCanonical:true}]}')"
            code_response="$(curl --fail --silent --show-error --max-time 8 -H "Content-Type: application/json" --data "$probe" "$endpoint" 2>/dev/null || true)"
            code="$(jq -r '.result // empty' <<< "$code_response" 2>/dev/null || true)"
            if [[ "$code" =~ ^0x([0-9a-fA-F]{2})+$ ]]; then
              selected="$endpoint"
              block_digits="$(printf '%s' "$block_hex" | sed 's/^0x//')"
              block="$((16#$block_digits))"
              echo "Selected provider supports EIP-1898 state reads at a finalized/pinned block."
              echo "rpc_url=$selected" >> "$GITHUB_OUTPUT"
              echo "block=$block" >> "$GITHUB_OUTPUT"
              echo "hash=$block_hash" >> "$GITHUB_OUTPUT"
              echo "parent_hash=$parent_hash" >> "$GITHUB_OUTPUT"
              break
            fi
            echo "Provider could not serve contract code by canonical block hash; trying next endpoint."
          done
          if [ -z "$selected" ]; then
            echo "No configured public Ethereum RPC passed the pinned-hash state-read probe."
            exit 1
          fi
          echo "Pinned Ethereum block $block via $selected ($block_hash)"
      - name: Start Anvil fork at the pinned block
        env:
          RPC_URL: ${{ steps.fork.outputs.rpc_url }}
          FORK_BLOCK: ${{ steps.fork.outputs.block }}
          FORK_BLOCK_HASH: ${{ steps.fork.outputs.hash }}
        run: |
          set -euo pipefail
          anvil --fork-url "$RPC_URL" --fork-block-number "$FORK_BLOCK" --host 127.0.0.1 --port 8545 --silent > /tmp/raawaa-anvil.log 2>&1 &
          echo "$!" > /tmp/raawaa-anvil.pid
          for attempt in $(seq 1 60); do
            response="$(curl --silent --show-error --max-time 5 -H "Content-Type: application/json" --data '{"jsonrpc":"2.0","id":1,"method":"eth_getBlockByNumber","params":["latest",false]}' http://127.0.0.1:8545 || true)"
            local_hash="$(jq -r '.result.hash // empty' <<< "$response" 2>/dev/null || true)"
            if [ "$local_hash" = "$FORK_BLOCK_HASH" ]; then
              echo "Local Anvil is serving the exact pinned block $FORK_BLOCK ($local_hash)"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/raawaa-anvil.log
          echo "Local Anvil did not serve the expected pinned block hash"
          exit 1
      - name: Execute real V2 pair callback only on the local fork
        env:
          MAINNET_RPC_URL: http://127.0.0.1:8545
          FORK_BLOCK: ${{ steps.fork.outputs.block }}
          FORK_BLOCK_HASH: ${{ steps.fork.outputs.hash }}
          FORK_PARENT_HASH: ${{ steps.fork.outputs.parent_hash }}
        run: forge test --match-path test/AnvilForkFlashSwap.t.sol -vvv
      - name: Stop local Anvil fork
        if: always()
        run: |
          if [ -f /tmp/raawaa-anvil.pid ]; then
            kill "$(cat /tmp/raawaa-anvil.pid)" 2>/dev/null || true
          fi
