name: Automatic D1 Migrations

on:
  push:
    branches: [main]
    paths:
      - "migrations/**"
      - ".github/workflows/d1-auto-migrate.yml"

permissions:
  contents: read

concurrency:
  group: d1-migrations-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out merged main
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify target database configuration
        run: |
          grep -F 'database_id = "f0ffbed3-940f-488d-a7d1-31cbc5fbf742"' wrangler.toml
          grep -F 'database_name = "raawaa-autonomous-e"' wrangler.toml
      - name: Show remote migration status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 migrations list raawaa-autonomous-e --remote --config wrangler.toml
      - name: Apply additive migrations after merge to main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 migrations apply raawaa-autonomous-e --remote --config wrangler.toml
