name: Microsoft Agent Framework Isolated Evaluation

on:
  pull_request:
    paths:
      - "experiments/microsoft-agent-framework/**"
      - "experiments/microsoft_agent_framework/**"
      - "requirements-agent-framework-eval.txt"
      - "docs/research/microsoft-agent-framework-evaluation.md"
      - ".github/workflows/agent-framework-eval.yml"

permissions:
  contents: read

concurrency:
  group: agent-framework-eval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  isolated-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned optional evaluation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-agent-framework-eval.txt
      - name: Run deterministic multi-branch and checkpoint evaluation
        run: PYTHONPATH=. python experiments/microsoft-agent-framework/evaluate.py
      - name: Test pinned framework checkpoint codec adapter
        run: python -m unittest discover -s experiments/microsoft_agent_framework -p 'test_*.py' -v
