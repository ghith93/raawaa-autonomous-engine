name: Engine CI

on:
  push:
    branches: [main, "bootstrap/**", "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate policy and agent roster
        run: python -m engine.cli audit
      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run Cloudflare Worker unit tests
        run: npm run test:worker
      - name: Run Cloudflare Workflows spike unit tests
        run: npm run test:workflow-spike
