name: Engine CI

on:
  # Every branch, not only main. An agent working branch used to be compiled for
  # the first time when its PR opened, so a trivial YAML or import error was
  # discovered at review instead of at push. Widening the push filter does not
  # add production reach: every staging/deploy job is separately gated on
  # `github.ref == 'refs/heads/main'` and skips on a branch push.
  push:
  pull_request:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: engine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Verify immutable GitHub Actions dependency pins
        run: python scripts/check_workflow_action_pins.py
      - name: Verify secret-bearing manual workflows are restricted to main
        run: python scripts/check_workflow_dispatch_guards.py
      - name: Validate policy and agent roster
        run: python -m engine.cli audit
      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile remote Staging verification harness
        run: python -m py_compile scripts/verify_staging_monetary_ledger.py scripts/run_staging_d1_claim_contention.py scripts/run_staging_lane_isolation.py scripts/run_specialist_lanes.py
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Type-check Supabase fallback Edge Function
        run: npx --yes deno@2.9.6 check supabase/functions/engine-fallback/index.ts
      - name: Run Cloudflare Worker unit tests
        run: npm run test:worker
      - name: Run Cloudflare Workflows spike unit tests
        run: npm run test:workflow-spike
      - name: Install pinned Wrangler CLI without credentials
        run: npx --yes wrangler@4.156.1 --version
      - name: Run local Cloudflare D1 Worker integration smoke test
        run: npm run test:d1-local
      - name: Run local Cloudflare Workflows runtime smoke test
        run: npm run test:workflow-local
  zero_cost_preflight:
    name: Verify zero-cost Cloudflare boundary (read-only)
    needs: test
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      zero_cost_eligible: ${{ steps.preflight.outputs.zero_cost_eligible }}
    steps:
      - name: Check out the exact tested main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Verify there are no active paid Cloudflare subscriptions
        id: preflight
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/verify_cloudflare_zero_cost_boundary.py

  staging-migrate:
    name: Apply reviewed migrations to Staging
    needs: [test, zero_cost_preflight]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.zero_cost_preflight.outputs.zero_cost_eligible == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: d1-staging-migrations
      cancel-in-progress: false
    steps:
      - name: Check out the exact main commit that passed Engine CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Validate staging and production database separation
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("wrangler.staging.toml").open("rb") as stream:
              staging = tomllib.load(stream)
          with Path("wrangler.toml").open("rb") as stream:
              production = tomllib.load(stream)

          expected_id = "231dd948-04a0-49e3-ad73-444f77d69477"
          expected_name = "raawaa-engine-staging"
          expected_production_id = "f0ffbed3-940f-488d-a7d1-31cbc5fbf742"
          bindings = staging.get("d1_databases", [])
          production_bindings = production.get("d1_databases", [])
          if len(bindings) != 1 or len(production_bindings) != 1:
              raise SystemExit("Refusing staging migration: expected one D1 binding in each config")
          binding = bindings[0]
          production_binding = production_bindings[0]
          if binding.get("binding") != "DB" or binding.get("database_name") != expected_name or binding.get("database_id") != expected_id or binding.get("migrations_dir") != "migrations":
              raise SystemExit("Refusing staging migration: staging D1 identity or migrations directory did not match the approved target")
          if production_binding.get("database_name") != "raawaa-autonomous-e" or production_binding.get("database_id") != expected_production_id:
              raise SystemExit("Refusing staging migration: production D1 identity changed from the reviewed baseline")
          if binding.get("database_id") == production_binding.get("database_id") or binding.get("database_name") == production_binding.get("database_name"):
              raise SystemExit("Refusing staging migration: staging and production D1 targets are not distinct")
          print("Staging target verified; production D1 identity is separate.")
          PY
      - name: Show pending staging migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.156.1 d1 migrations list raawaa-engine-staging --remote --config wrangler.staging.toml
      - name: Apply pending migrations to staging only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.156.1 d1 migrations apply raawaa-engine-staging --remote --config wrangler.staging.toml
      - name: Verify staging migration state after apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.156.1 d1 migrations list raawaa-engine-staging --remote --config wrangler.staging.toml

  staging-worker-verify:
    name: Deploy isolated Staging Worker and verify monetary ledger
    needs: [test, staging-migrate, zero_cost_preflight]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.zero_cost_preflight.outputs.zero_cost_eligible == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: d1-staging-worker-verification
      cancel-in-progress: false
    steps:
      - name: Check out the exact main commit that passed CI and Staging migration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Verify isolated Staging Worker and D1 identities
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("wrangler.staging.toml").open("rb") as stream:
              staging = tomllib.load(stream)
          with Path("wrangler.toml").open("rb") as stream:
              production = tomllib.load(stream)
          expected_staging_id = "231dd948-04a0-49e3-ad73-444f77d69477"
          expected_production_id = "f0ffbed3-940f-488d-a7d1-31cbc5fbf742"
          if staging.get("name") != "raawaa-autonomous-engine-staging" or staging.get("name") == production.get("name"):
              raise SystemExit("Refusing deployment: unexpected or production-colliding Staging Worker name")
          if staging.get("workers_dev") is not True or staging.get("routes") or staging.get("route"):
              raise SystemExit("Refusing deployment: Staging Worker must use workers.dev only and no custom routes")
          staging_d1 = staging.get("d1_databases", [])
          production_d1 = production.get("d1_databases", [])
          if len(staging_d1) != 1 or len(production_d1) != 1:
              raise SystemExit("Refusing deployment: expected one D1 binding in each config")
          if staging_d1[0].get("database_name") != "raawaa-engine-staging" or staging_d1[0].get("database_id") != expected_staging_id:
              raise SystemExit("Refusing deployment: Staging D1 identity mismatch")
          if production_d1[0].get("database_id") != expected_production_id:
              raise SystemExit("Refusing deployment: production D1 identity changed")
          if staging_d1[0].get("database_id") == production_d1[0].get("database_id"):
              raise SystemExit("Refusing deployment: Staging and production D1 IDs must differ")
          print("Validated isolated Staging Worker and D1 target.")
          PY
      - name: Generate an ephemeral Staging-only bearer token
        shell: bash
        run: |
          STAGING_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          QUOTA_ADMIN_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          RESEARCHER_LANE_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          echo "::add-mask::$STAGING_TOKEN"
          echo "::add-mask::$QUOTA_ADMIN_TOKEN"
          echo "::add-mask::$RESEARCHER_LANE_TOKEN"
          echo "RAAWAA_ENGINE_STAGING_API_TOKEN=$STAGING_TOKEN" >> "$GITHUB_ENV"
          echo "RAAWAA_ENGINE_STAGING_QUOTA_ADMIN_TOKEN=$QUOTA_ADMIN_TOKEN" >> "$GITHUB_ENV"
          echo "RAAWAA_ENGINE_STAGING_RESEARCHER_LANE_TOKEN=$RESEARCHER_LANE_TOKEN" >> "$GITHUB_ENV"
      - name: Deploy the isolated Staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.156.1 deploy --config wrangler.staging.toml
      - name: Install the ephemeral Staging bearer token as a Worker secret
        id: install_staging_token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: printf '%s' "$RAAWAA_ENGINE_STAGING_API_TOKEN" | npx --yes wrangler@4.156.1 secret put ENGINE_API_TOKEN --config wrangler.staging.toml
      - name: Install the ephemeral Staging quota-admin token
        id: install_staging_quota_admin_token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: printf '%s' "$RAAWAA_ENGINE_STAGING_QUOTA_ADMIN_TOKEN" | npx --yes wrangler@4.156.1 secret put ENGINE_QUOTA_ADMIN_TOKEN --config wrangler.staging.toml
      - name: Install the ephemeral Staging researcher lane capability
        id: install_staging_researcher_lane_token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: printf '%s' "$RAAWAA_ENGINE_STAGING_RESEARCHER_LANE_TOKEN" | npx --yes wrangler@4.156.1 secret put ENGINE_RESEARCHER_LANE_TOKEN --config wrangler.staging.toml
      - name: Wait for temporary Staging consumer capabilities to propagate
        env:
          RAAWAA_ENGINE_API_URL: https://raawaa-autonomous-engine-staging.ghith-shikhkhaled.workers.dev
          RAAWAA_ENGINE_API_TOKEN: ${{ env.RAAWAA_ENGINE_STAGING_API_TOKEN }}
          RAAWAA_ENGINE_RESEARCHER_LANE_TOKEN: ${{ env.RAAWAA_ENGINE_STAGING_RESEARCHER_LANE_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          base = os.environ["RAAWAA_ENGINE_API_URL"].rstrip("/")
          token = os.environ["RAAWAA_ENGINE_API_TOKEN"]
          lane_token = os.environ["RAAWAA_ENGINE_RESEARCHER_LANE_TOKEN"]
          deadline = time.monotonic() + 90
          attempt = 0
          while True:
              attempt += 1
              statuses = {}
              for name, path, extra in (
                  ("general", "/v1/tasks?limit=1", {}),
                  ("researcher", "/v1/tasks?limit=1&worker_lane=specialist%3Aresearcher",
                   {"X-Engine-Lane-Token": lane_token}),
              ):
                  headers = {
                      "Accept": "application/json",
                      "Authorization": "Bearer " + token,
                      "User-Agent": "RaawaaAutonomousEngine/1.0 (+https://github.com/ghith93/raawaa-autonomous-engine)",
                      **extra,
                  }
                  request = Request(base + path, headers=headers, method="GET")
                  try:
                      with urlopen(request, timeout=8) as response:
                          statuses[name] = response.status
                  except HTTPError as error:
                      statuses[name] = error.code
                  except (URLError, TimeoutError, OSError):
                      statuses[name] = "request_failed"
              print("Staging capability propagation attempt " + str(attempt) +
                    ": general=" + str(statuses["general"]) +
                    ", researcher=" + str(statuses["researcher"]), flush=True)
              if statuses == {"general": 200, "researcher": 200}:
                  print("Both temporary Staging consumer capabilities are active.")
                  break
              if time.monotonic() >= deadline:
                  raise SystemExit("Staging consumer capabilities did not propagate within 90 seconds.")
              time.sleep(5)
          PY
      - name: Prove concurrent claims against remote Staging D1
        env:
          RAAWAA_ENGINE_API_URL: https://raawaa-autonomous-engine-staging.ghith-shikhkhaled.workers.dev
          RAAWAA_ENGINE_API_TOKEN: ${{ env.RAAWAA_ENGINE_STAGING_API_TOKEN }}
          RAAWAA_ENGINE_LIVE_INFERENCE: disabled
        run: python scripts/run_staging_d1_claim_contention.py
      - name: Prove generic and researcher lane isolation against remote Staging D1
        env:
          RAAWAA_ENGINE_API_URL: https://raawaa-autonomous-engine-staging.ghith-shikhkhaled.workers.dev
          RAAWAA_ENGINE_API_TOKEN: ${{ env.RAAWAA_ENGINE_STAGING_API_TOKEN }}
          RAAWAA_ENGINE_LANE_TOKEN: ${{ env.RAAWAA_ENGINE_STAGING_RESEARCHER_LANE_TOKEN }}
          RAAWAA_ENGINE_LIVE_INFERENCE: disabled
        run: python scripts/run_staging_lane_isolation.py
      - name: Verify remote Staging D1 monetary ledger
        env:
          RAAWAA_ENGINE_STAGING_URL: https://raawaa-autonomous-engine-staging.ghith-shikhkhaled.workers.dev
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/verify_staging_monetary_ledger.py
      - name: Revoke the ephemeral Staging quota-admin token
        if: ${{ always() && steps.install_staging_quota_admin_token.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.156.1 secret delete ENGINE_QUOTA_ADMIN_TOKEN --config wrangler.staging.toml
      - name: Revoke the ephemeral Staging researcher lane capability
        if: ${{ always() && steps.install_staging_researcher_lane_token.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.156.1 secret delete ENGINE_RESEARCHER_LANE_TOKEN --config wrangler.staging.toml
      - name: Revoke the ephemeral Staging bearer token
        if: ${{ always() && steps.install_staging_token.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.156.1 secret delete ENGINE_API_TOKEN --config wrangler.staging.toml

  publish-staging-ops-telemetry:
    name: Publish sanitized CI and inference-gate telemetry to Staging
    needs: [test, staging-migrate, staging-worker-verify, zero_cost_preflight]
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.zero_cost_preflight.outputs.zero_cost_eligible == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Publish sanitized operational snapshots to Staging D1 only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENGINE_CI_TEST_RESULT: ${{ needs.test.result }}
          ENGINE_CI_STAGING_MIGRATE_RESULT: ${{ needs.staging-migrate.result }}
          ENGINE_CI_STAGING_WORKER_RESULT: ${{ needs.staging-worker-verify.result }}
          RAAWAA_ENGINE_LIVE_INFERENCE: ${{ vars.RAAWAA_ENGINE_LIVE_INFERENCE || 'disabled' }}
        run: python scripts/publish_staging_ops_telemetry.py

  staging-mobile-status-verify:
    name: Verify authenticated Staging mobile status readback
    needs: [publish-staging-ops-telemetry, staging-worker-verify, zero_cost_preflight]
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.zero_cost_preflight.outputs.zero_cost_eligible == 'true' && needs.publish-staging-ops-telemetry.result == 'success' && needs.staging-worker-verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: d1-staging-worker-verification
      cancel-in-progress: false
    steps:
      - name: Check out the exact main commit that published telemetry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Install pinned Wrangler CLI without credentials
        run: npx --yes wrangler@4.156.1 --version
      - name: Generate an ephemeral Staging-only bearer token
        shell: bash
        run: |
          STAGING_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          echo "::add-mask::$STAGING_TOKEN"
          echo "RAAWAA_ENGINE_STAGING_API_TOKEN=$STAGING_TOKEN" >> "$GITHUB_ENV"
      - name: Install the ephemeral token on the already verified Staging Worker
        id: install_staging_token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: printf '%s' "$RAAWAA_ENGINE_STAGING_API_TOKEN" | npx --yes wrangler@4.156.1 secret put ENGINE_API_TOKEN --config wrangler.staging.toml
      - name: Verify current CI and default kill-switch snapshots through the mobile API
        env:
          RAAWAA_ENGINE_API_URL: https://raawaa-autonomous-engine-staging.ghith-shikhkhaled.workers.dev
        run: python scripts/verify_staging_mobile_status.py
      - name: Revoke the ephemeral Staging bearer token
        if: ${{ always() && steps.install_staging_token.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.156.1 secret delete ENGINE_API_TOKEN --config wrangler.staging.toml
