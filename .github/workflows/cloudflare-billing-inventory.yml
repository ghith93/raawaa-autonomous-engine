name: Cloudflare Billing Spend-Policy Inventory

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-billing-inventory.yml"
      - "scripts/verify_cloudflare_zero_cost_boundary.py"
      - "config/policy.json"
      - "docs/operations.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-billing-inventory
  cancel-in-progress: false

jobs:
  read-only-inventory:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out the exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate billing inventory credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured."; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured."; exit 1; }
          echo "Required secret names are present; values are not printed."

      - name: Read Cloudflare billing controls without mutation
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          policies_file="$(mktemp)"
          subscriptions_file="$(mktemp)"
          trap 'rm -f "$policies_file" "$subscriptions_file"' EXIT

          policies_status="$(curl --silent --show-error \
            --retry 3 --retry-delay 2 --retry-max-time 15 --connect-timeout 10 --max-time 20 \
            --output "$policies_file" \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Accept: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/billing/spend-policies")"

          subscriptions_status="$(curl --silent --show-error \
            --retry 3 --retry-delay 2 --retry-max-time 15 --connect-timeout 10 --max-time 20 \
            --output "$subscriptions_file" \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Accept: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/subscriptions")"

          python - "$policies_file" "$policies_status" "$subscriptions_file" "$subscriptions_status" <<'PY'
          import json
          import sys

          policies_path, policies_status, subscriptions_path, subscriptions_status = sys.argv[1:]
          summary = {
              "read_only": True,
              "mutations": 0,
              "billing_read_access_confirmed": subscriptions_status == "200",
              "spend_policy_endpoint_available": policies_status == "200",
              "spend_policy_http_status": int(policies_status),
              "subscriptions_http_status": int(subscriptions_status),
              "billing_details_printed": False,
          }

          if policies_status == "200":
              with open(policies_path, encoding="utf-8") as stream:
                  payload = json.load(stream)
              if payload.get("success") is not True or not isinstance(payload.get("result"), list):
                  raise SystemExit("Cloudflare returned an unsuccessful spend-policy response.")
              policies = payload["result"]
              summary["spend_policy_count"] = len(policies)
              summary["enabled_workers_usage_block"] = any(
                  item.get("product_id") == "workers"
                  and item.get("action") == "usage_block"
                  and item.get("enabled") is True
                  for item in policies
              )
              summary["enabled_durable_objects_usage_block"] = any(
                  item.get("product_id") == "durable_objects"
                  and item.get("action") == "usage_block"
                  and item.get("enabled") is True
                  for item in policies
              )

          if subscriptions_status == "200":
              with open(subscriptions_path, encoding="utf-8") as stream:
                  payload = json.load(stream)
              if payload.get("success") is not True or not isinstance(payload.get("result"), list):
                  raise SystemExit("Cloudflare returned an unsuccessful subscription response.")
              subscriptions = payload["result"]
              active = [
                  item for item in subscriptions
                  if item.get("state") not in {"Cancelled", "Failed", "Expired"}
              ]
              paid = [
                  item for item in active
                  if isinstance(item.get("price"), (int, float))
                  and item.get("price", 0) > 0
              ]
              summary["subscription_count"] = len(subscriptions)
              summary["active_subscription_count"] = len(active)
              summary["active_paid_subscription_count"] = len(paid)

          print(json.dumps(summary, indent=2))
          # Only fixed numeric statuses and booleans are published as a check
          # annotation; no raw billing data, account identifiers or secrets.
          from scripts.billing_audit_annotation import build_annotation
          print(build_annotation(summary))
          PY

          if [ "$subscriptions_status" != "200" ]; then
            echo "Cloudflare subscription inventory is unavailable; Billing Read access is not verified."
            exit 1
          fi
          if [ "$policies_status" = "404" ]; then
            echo "Account-level subscriptions were read successfully, but the spend-policy endpoint is unavailable for this account/API context. No external usage_block policy is verified; keep paid overages disabled."
          elif [ "$policies_status" != "200" ]; then
            echo "Spend-policy inventory returned HTTP $policies_status. No external usage_block policy is verified."
            exit 1
          fi

      - name: Evaluate the zero-cost gate and report which endpoint answered what
        # This workflow is the diagnosis surface, so the gate's exit code is
        # recorded rather than failing the run. The run used to report only
        # "exit code 1" with no readable cause: a merged gate made it fail the
        # whole job, so the annotations that explain *why* never mattered to a
        # reviewer reading the run list. The gate itself is unchanged - it still
        # exits non-zero, and the remote-effect workflows still fail closed on
        # it. Here the outcome is the artifact.
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_READ_ALL_ZONES_CONFIRMED: ${{ vars.CLOUDFLARE_ZONE_READ_ALL_ZONES_CONFIRMED }}
        run: |
          set +e
          python scripts/verify_cloudflare_zero_cost_boundary.py
          gate_exit=$?
          echo "zero_cost_gate_exit=$gate_exit"
          # Read-only, one request per endpoint, status codes only. This is what
          # distinguishes "the endpoint is missing for this token" from "the
          # account carries a paid plan" - the two were previously
          # indistinguishable because every endpoint's HTTP error collapsed into
          # one reason token.
          python - "$CLOUDFLARE_ACCOUNT_ID" <<'PY'
          import os, sys
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, build_opener
          account = sys.argv[1]
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          endpoints = {
              "account_subscriptions": f"https://api.cloudflare.com/client/v4/accounts/{account}/subscriptions",
              "zones": "https://api.cloudflare.com/client/v4/zones?account.id=%s&page=1&per_page=50&type=full,partial,secondary,internal" % account,
              "spend_policies": f"https://api.cloudflare.com/client/v4/accounts/{account}/billing/spend-policies",
          }
          open_request = build_opener().open
          for name, url in endpoints.items():
              request = Request(url, headers={"Authorization": "Bearer " + token,
                                              "Accept": "application/json",
                                              "User-Agent": "RaawaaAutonomousEngine-ZeroCostPreflight/3.0"},
                                method="GET")
              try:
                  with open_request(request, timeout=15) as response:
                      print(f"::notice title=Endpoint reachability::{name}=" + str(response.status))
              except HTTPError as exc:
                  print(f"::notice title=Endpoint reachability::{name}=" + str(exc.code))
              except (URLError, OSError, TimeoutError) as exc:
                  print(f"::notice title=Endpoint reachability::{name}=transport_{type(exc).__name__}")
          # Status codes only: no URLs, account ids, bodies or credentials.
          PY
          echo "Endpoint reachability recorded. The zero-cost gate remains authoritative."
