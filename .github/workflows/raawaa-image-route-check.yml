name: Raawaa Image Route Check

# Runs where the credentials already live: the repository's own secrets.
#
# This exists because the sandbox that develops the code has no Cloudflare
# credentials and cannot reach the Workers AI endpoint, while GitHub Actions can.
# Rather than ask for a token to be pasted into a chat, the check runs here and
# prints only verdicts and masked identifiers.

on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
    paths:
      - ".github/workflows/raawaa-image-route-check.yml"
      - "scripts/raawaa_verify_cloudflare.py"

permissions:
  contents: read

jobs:
  verify:
    name: Verify Workers AI, D1, and image generation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Confirm secrets are present (values never printed)
        shell: bash
        env:
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$ACCOUNT" ] || { echo "CLOUDFLARE_ACCOUNT_ID is missing from repository secrets."; exit 1; }
          [ -n "$TOKEN" ]   || { echo "CLOUDFLARE_API_TOKEN is missing from repository secrets."; exit 1; }
          echo "Both secret names are present. Values withheld."

      # Findings are emitted as annotations so the verdict is readable from
      # `gh run view` without downloading logs, which the API does not always serve.
      - name: Verify credentials and permissions
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          python scripts/raawaa_verify_cloudflare.py --skip-ai > verify.txt 2>&1
          code=$?
          cat verify.txt
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            case "$line" in
              "[PASS]"*) echo "::notice::${line}" ;;
              "[FAIL]"*) echo "::error::${line}" ;;
              *fix*) echo "::warning::${line}" ;;
              *) echo "::notice::${line}" ;;
            esac
          done < verify.txt
          echo "verify_exit=$code"

      - name: Generate one real image through the free route
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python scripts/raawaa_images.py \
            --prompt "soft beige linen fabric, natural window light, minimal, empty centre" \
            --out raawaa-check/feed.png --width 1024 --height 1024 --steps 4
          python scripts/raawaa_asset_check.py raawaa-check/feed.png || true
          ls -l raawaa-check/feed.png

      - name: Report the daily allowance position
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/raawaa_images.py --status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raawaa-image-check
          path: raawaa-check/
          retention-days: 7
