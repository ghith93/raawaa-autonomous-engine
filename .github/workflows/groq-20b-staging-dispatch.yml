name: Groq 20B Staging Audit (No Inference)
on:
  workflow_dispatch:
    inputs:
      confirmation_string:
        description: 'Must match "ARENA-GROQ-20B-STAGING-CONFIRM"'
        required: true
        type: string
      run_scoped_id:
        description: 'Correlation identifier only; not an idempotency guarantee'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: groq-staging-audit-${{ inputs.run_scoped_id }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Verify dispatch context
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          CONFIRMATION: ${{ inputs.confirmation_string }}
          SCOPED_ID: ${{ inputs.run_scoped_id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$EVENT_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$EVENT_SHA"
          test "$CONFIRMATION" = ARENA-GROQ-20B-STAGING-CONFIRM
          [[ "$SCOPED_ID" =~ ^[a-zA-Z0-9-]{1,64}$ ]]
      - name: Check local policy and provider defaults
        run: python3 scripts/audit_groq_defaults.py
      - name: Run offline regression tests
        run: |
          python3 -m unittest discover -s tests -p 'test_groq_defaults_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_exact_id_reconciliation.py' -v
      - name: Report scope
        run: echo 'Local configuration audit only; no inference, Staging access, billing verification, or idempotency guarantee.'
