name: Groq API Connection Check

on:
  push:
    branches: [main]
    paths:
      - "scripts/groq_connection_check.py"
      - ".github/workflows/groq-connection-check.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * 1"

permissions:
  contents: read

concurrency:
  group: groq-api-connection-check
  cancel-in-progress: false

jobs:
  verify-connection:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Verify Groq API authentication and Free model catalog (read only)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/groq_connection_check.py
