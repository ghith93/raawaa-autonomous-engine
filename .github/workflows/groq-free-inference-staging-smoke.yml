name: One-shot Groq Free inference Staging smoke
# Re-run only when this one-shot workflow is deliberately revised.
# Diagnostics emit only aggregate usage and route error metadata; never payloads or keys.
# Wait for Worker deployment and secret propagation before authenticated calls.

on:
  workflow_run:
    workflows: ["Engine CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  # Serialize with the main CI Staging Worker verification deployment.
  group: d1-staging-worker-verification
  cancel-in-progress: false

jobs:
  smoke:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      contains(github.event.workflow_run.head_commit.message, '[groq-specialist-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact main commit that passed Engine CI and Staging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Verify isolated Staging target and Free-only policy
        run: |
          python -m engine.cli audit
          python - <<'PY'
          import json, tomllib
          from pathlib import Path
          with Path("wrangler.staging.toml").open("rb") as f: staging = tomllib.load(f)
          with Path("wrangler.toml").open("rb") as f: production = tomllib.load(f)
          s = staging.get("d1_databases", [])
          p = production.get("d1_databases", [])
          if staging.get("name") != "raawaa-autonomous-engine-staging" or staging.get("workers_dev") is not True or staging.get("routes") or staging.get("route"):
              raise SystemExit("Refusing: Staging Worker is not isolated on workers.dev")
          if len(s) != 1 or len(p) != 1 or s[0].get("database_id") != "231dd948-04a0-49e3-ad73-444f77d69477" or p[0].get("database_id") != "f0ffbed3-940f-488d-a7d1-31cbc5fbf742" or s[0].get("database_id") == p[0].get("database_id"):
              raise SystemExit("Refusing: Staging and Production D1 identities are not the reviewed separate databases")
          default_policy = json.loads(Path("config/policy.json").read_text())
          default_routes = json.loads(Path("config/provider_profiles.json").read_text())["routes"]
          if default_policy.get("mode") != "safe_dry_run" or any(r.get("enabled") for r in default_routes):
              raise SystemExit("Refusing: repository defaults must remain fail-closed")
          policy = json.loads(Path("config/policy.groq-smoke.json").read_text())
          mp = policy["model_policy"]
          enabled = [r for r in json.loads(Path("config/provider_profiles.groq-smoke.json").read_text())["routes"] if r.get("enabled")]
          if policy.get("mode") != "live_inference_opt_in" or policy.get("allow_paid_model_calls") is not False or policy.get("allow_external_writes") is not False or mp.get("paid_fallback_enabled") is not False or mp.get("provider_hard_stop_verified") is not True:
              raise SystemExit("Refusing: Staging Free-only live policy gates are not satisfied")
          allowed_models = {"openai/gpt-oss-20b"}
          if {r.get("model") for r in enabled} != allowed_models or any(r.get("provider") != "groq" or r.get("input_cost_per_million_usd") != 0 or r.get("output_cost_per_million_usd") != 0 for r in enabled):
              raise SystemExit("Refusing: only the two verified zero-cost Groq routes may be enabled")
          print("Staging isolation, fail-closed defaults, and isolated zero-cost Groq smoke policy verified.")
          PY
      - name: Validate Cloudflare and Groq credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$GROQ_API_KEY" || { echo "Missing GitHub secret GROQ_API_KEY"; exit 1; }
      - name: Generate ephemeral Staging bearer token
        shell: bash
        run: |
          STAGING_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          STAGING_ADMIN_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          RESEARCHER_LANE_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          echo "::add-mask::$STAGING_TOKEN"
          echo "::add-mask::$STAGING_ADMIN_TOKEN"
          echo "::add-mask::$RESEARCHER_LANE_TOKEN"
          echo "RAAWAA_ENGINE_STAGING_API_TOKEN=$STAGING_TOKEN" >> "$GITHUB_ENV"
          # D1 quota and monetary adapters read the canonical API token name.
          echo "RAAWAA_ENGINE_API_TOKEN=$STAGING_TOKEN" >> "$GITHUB_ENV"
          echo "RAAWAA_ENGINE_QUOTA_ADMIN_TOKEN=$STAGING_ADMIN_TOKEN" >> "$GITHUB_ENV"
          echo "RAAWAA_ENGINE_STAGING_RESEARCHER_LANE_TOKEN=$RESEARCHER_LANE_TOKEN" >> "$GITHUB_ENV"
      - name: Deploy isolated Staging Worker with one temporary GPT-OSS 20B quota route
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          source = Path("wrangler.staging.toml").read_text(encoding="utf-8")
          match = re.search(r"(?m)^QUOTA_ROUTE_LIMITS_JSON = '''(.*?)'''$", source, re.S)
          if not match:
              raise SystemExit("Refusing: Staging quota route configuration was not found.")
          routes = json.loads(match.group(1))
          target = "groq:primary:openai/gpt-oss-20b"
          fallback = "groq:primary:openai/gpt-oss-120b"
          if target not in routes or fallback not in routes:
              raise SystemExit("Refusing: expected Groq routes are absent from Staging configuration.")
          if routes[fallback].get("enabled") is not False:
              raise SystemExit("Refusing: GPT-OSS 120B must remain disabled.")
          for route_id, config in routes.items():
              config["enabled"] = route_id == target
          generated = source[:match.start(1)] + json.dumps(routes, separators=(",", ":")) + source[match.end(1):]
          Path("wrangler.staging.groq-smoke.generated.toml").write_text(generated, encoding="utf-8")
          print("Generated isolated Staging config: only Groq GPT-OSS 20B quota route is enabled.")
          PY
          npx --yes wrangler@4.156.1 deploy --config wrangler.staging.groq-smoke.generated.toml
      - name: Enforce zero-USD hard caps in isolated Staging D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s\n' "UPDATE monetary_budget_policy SET daily_budget_nanos=0, monthly_budget_nanos=0, per_task_budget_nanos=0, updated_at=CURRENT_TIMESTAMP WHERE policy_key='default';" > /tmp/raawaa-staging-zero-budget.sql
          npx --yes wrangler@4.156.1 d1 execute raawaa-engine-staging --remote --config wrangler.staging.toml --file /tmp/raawaa-staging-zero-budget.sql
          npx --yes wrangler@4.156.1 d1 execute raawaa-engine-staging --remote --config wrangler.staging.toml --command "SELECT daily_budget_nanos, monthly_budget_nanos, per_task_budget_nanos, enabled FROM monetary_budget_policy WHERE policy_key='default';"
      - name: Install ephemeral Staging API token
        id: install_staging_token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$RAAWAA_ENGINE_STAGING_API_TOKEN" || { echo "Missing ephemeral Staging token"; exit 1; }
          printf '%s' "$RAAWAA_ENGINE_STAGING_API_TOKEN" | npx --yes wrangler@4.156.1 secret put ENGINE_API_TOKEN --config wrangler.staging.toml
      - name: Install ephemeral Staging quota-admin token
        id: install_staging_admin_token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$RAAWAA_ENGINE_QUOTA_ADMIN_TOKEN" || { echo "Missing ephemeral Staging quota-admin token"; exit 1; }
          printf '%s' "$RAAWAA_ENGINE_QUOTA_ADMIN_TOKEN" | npx --yes wrangler@4.156.1 secret put ENGINE_QUOTA_ADMIN_TOKEN --config wrangler.staging.toml
      - name: Install ephemeral Staging researcher lane capability
        id: install_staging_researcher_lane_token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$RAAWAA_ENGINE_STAGING_RESEARCHER_LANE_TOKEN" || { echo "Missing ephemeral researcher lane token"; exit 1; }
          printf '%s' "$RAAWAA_ENGINE_STAGING_RESEARCHER_LANE_TOKEN" | npx --yes wrangler@4.156.1 secret put ENGINE_RESEARCHER_LANE_TOKEN --config wrangler.staging.toml
      - name: Reconcile the previously rejected Staging HTTP 403 reservation
        env:
          RAAWAA_ENGINE_API_URL: https://raawaa-autonomous-engine-staging.ghith-shikhkhaled.workers.dev
        run: python scripts/reconcile_groq_403_staging_reservation.py
      - name: Run one bounded Groq Free inference and verify zero spend
        env:
          RAAWAA_ENGINE_API_URL: https://raawaa-autonomous-engine-staging.ghith-shikhkhaled.workers.dev
          RAAWAA_ENGINE_LIVE_INFERENCE: enabled
          RAAWAA_ENGINE_WORKER_LANE: specialist:researcher
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          # GITHUB_ENV values are available to this shell. Map the ephemeral
          # capability explicitly instead of relying on expression-context
          # interpolation for a value generated by an earlier step.
          test -n "$RAAWAA_ENGINE_STAGING_RESEARCHER_LANE_TOKEN"
          export RAAWAA_ENGINE_RESEARCHER_LANE_TOKEN="$RAAWAA_ENGINE_STAGING_RESEARCHER_LANE_TOKEN"
          export RAAWAA_ENGINE_LANE_TOKEN="$RAAWAA_ENGINE_STAGING_RESEARCHER_LANE_TOKEN"
          python scripts/run_groq_free_inference_smoke.py
      - name: Restore fail-closed Staging Worker defaults
        if: ${{ always() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.156.1 deploy --config wrangler.staging.toml
      - name: Revoke ephemeral Staging API token
        if: ${{ always() && steps.install_staging_token.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.156.1 secret delete ENGINE_API_TOKEN --config wrangler.staging.toml
      - name: Revoke ephemeral Staging researcher lane capability
        if: ${{ always() && steps.install_staging_researcher_lane_token.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.156.1 secret delete ENGINE_RESEARCHER_LANE_TOKEN --config wrangler.staging.toml
      - name: Revoke ephemeral Staging quota-admin token
        if: ${{ always() && steps.install_staging_admin_token.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.156.1 secret delete ENGINE_QUOTA_ADMIN_TOKEN --config wrangler.staging.toml
