name: Scheduled D1 Task Runner

on:
  schedule:
    # Primary GitHub cadence; the Cloudflare watchdog is a separately gated fallback.
    # Refresh the schedule registration without changing the five-minute cadence; avoid minute 0 load.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
    # Separate specialist cadence; consumers have isolated capability tokens and remain dry-run only.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      run_public_research_once:
        description: "Unavailable: one-shot live research is disabled pending verified zero-cost controls"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: d1-task-runner
  cancel-in-progress: false

jobs:
  run-batch:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || github.event.schedule != '*/15 * * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Refuse unverified one-shot live research
        if: github.event_name == 'workflow_dispatch' && inputs.run_public_research_once
        run: |
          echo '::error::One-shot live research is disabled: account tier, provider-side zero-cost controls, and safe task isolation must be independently verified before re-enabling.'
          exit 1
      - name: Check out reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Validate safe execution policy
        run: python -m engine.cli audit
      - name: Diagnose public Worker health path
        id: health
        env:
          ENGINE_API_URL: https://raawaa-autonomous-engine-control.ghith-shikhkhaled.workers.dev
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import os
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          headers = {
              "Accept": "application/json",
              "User-Agent": "RaawaaAutonomousEngine/1.0 (+https://github.com/ghith93/raawaa-autonomous-engine)",
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("status=unknown\nray=not_supplied\n")
          client_id = os.environ.get("CF_ACCESS_CLIENT_ID", "")
          client_secret = os.environ.get("CF_ACCESS_CLIENT_SECRET", "")
          if bool(client_id) != bool(client_secret):
              raise SystemExit("Cloudflare Access service-token secrets must be configured as a pair.")
          if client_id and client_secret:
              headers["CF-Access-Client-Id"] = client_id
              headers["CF-Access-Client-Secret"] = client_secret
          url = os.environ["ENGINE_API_URL"].rstrip("/") + "/health"
          request = Request(url, headers=headers, method="GET")
          try:
              with urlopen(request, timeout=15) as response:
                  print(f"Public Worker health returned HTTP {response.status}.")
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                      output.write(f"status={response.status}\nray={response.headers.get('CF-Ray', 'not_supplied')}\n")
                  headers = response.headers
          except HTTPError as error:
              print(f"Public Worker health returned HTTP {error.code}.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write(f"status={error.code}\nray={error.headers.get('CF-Ray', 'not_supplied')}\n")
              headers = error.headers
          except (URLError, TimeoutError, OSError) as error:
              print(f"Public Worker health failed: {type(error).__name__}.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write(f"status=request_failed\nray=not_supplied\n")
              headers = None

          # Emit only non-secret response metadata; never print response bodies.
          for name in ("CF-Ray", "cf-mitigated", "server", "content-type"):
              value = headers.get(name) if headers else None
              if value:
                  print(f"{name}: {value}")
          PY
      - name: Verify authenticated POST path before task operations
        id: auth
        env:
          ENGINE_API_URL: https://raawaa-autonomous-engine-control.ghith-shikhkhaled.workers.dev
          ENGINE_API_TOKEN: ${{ secrets.ENGINE_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import os
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("status=unknown\nray=not_supplied\n")
          headers = {
              "Authorization": "Bearer " + os.environ["ENGINE_API_TOKEN"],
              "Content-Type": "application/json",
              "Accept": "application/json",
              "User-Agent": "RaawaaAutonomousEngine/1.0 (+https://github.com/ghith93/raawaa-autonomous-engine)",
          }
          client_id = os.environ.get("CF_ACCESS_CLIENT_ID", "")
          client_secret = os.environ.get("CF_ACCESS_CLIENT_SECRET", "")
          if bool(client_id) != bool(client_secret):
              raise SystemExit("Cloudflare Access service-token secrets must be configured as a pair.")
          if client_id and client_secret:
              headers["CF-Access-Client-Id"] = client_id
              headers["CF-Access-Client-Secret"] = client_secret
          request = Request(
              os.environ["ENGINE_API_URL"].rstrip("/") + "/v1/diagnostics/auth",
              data=b"{}",
              headers=headers,
              method="POST",
          )
          try:
              with urlopen(request, timeout=15) as response:
                  if response.status != 200:
                      raise SystemExit(f"Authenticated POST preflight returned HTTP {response.status}")
                  print("Authenticated POST preflight passed.")
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                      output.write(f"status={response.status}\nray={response.headers.get('CF-Ray', 'not_supplied')}\n")
          except HTTPError as error:
              print(f"Authenticated POST preflight returned HTTP {error.code}.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write(f"status={error.code}\nray={error.headers.get('CF-Ray', 'not_supplied')}\n")
              for name in ("CF-Ray", "cf-mitigated"):
                  value = error.headers.get(name) if error.headers else None
                  if value:
                      print(f"{name}: {value}")
              raise SystemExit(1)
          except (URLError, TimeoutError, OSError) as error:
              print(f"Authenticated POST preflight failed: {type(error).__name__}")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write(f"status=request_failed\nray=not_supplied\n")
              raise SystemExit(1)
          PY
      - name: Read D1-backed mobile status (read-only)
        id: mobile
        env:
          ENGINE_API_URL: https://raawaa-autonomous-engine-control.ghith-shikhkhaled.workers.dev
          ENGINE_API_TOKEN: ${{ secrets.ENGINE_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: python -m engine.mobile_status_probe
      - name: Process bounded D1 task batch
        id: batch
        env:
          # Provider credentials are scoped to the bounded worker process only.
          # The gateway still fails closed unless repository policy, provider
          # verification, quota evidence, and the operator switch all permit use.
          RAAWAA_ENGINE_LIVE_INFERENCE: disabled
          RAAWAA_ENGINE_API_URL: https://raawaa-autonomous-engine-control.ghith-shikhkhaled.workers.dev
          RAAWAA_ENGINE_API_TOKEN: ${{ secrets.ENGINE_API_TOKEN }}
          RAAWAA_ENGINE_QUOTA_ADMIN_TOKEN: ${{ secrets.ENGINE_QUOTA_ADMIN_TOKEN }}
          RAAWAA_ENGINE_CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          RAAWAA_ENGINE_CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          command = [sys.executable, "-m", "engine.cli", "run-batch",
                     "--max-tasks", "5", "--max-seconds", "60"]
          result = subprocess.run(command, capture_output=True, text=True, check=False)
          # Keep the per-task JSON where the reporting step can reach it. Job logs
          # are not downloadable from this project's own tooling, so a result that
          # only exists on stdout is effectively unreportable.
          Path("/tmp/raawaa-batch.json").write_text(result.stdout or "", encoding="utf-8")
          # A crash leaves no JSON, so stop_reason degrades to "unknown" and the
          # traceback is the only evidence. Logs are not downloadable here, so the
          # tail is kept for the reporting step to turn into an annotation.
          Path("/tmp/raawaa-batch.stderr").write_text(
              (result.stderr or "")[-4000:], encoding="utf-8")
          if result.stdout:
              print(result.stdout, end="")
          if result.stderr:
              print(result.stderr, file=sys.stderr, end="")
          tasks_processed = "unknown"
          stop_reason = "unknown"
          try:
              payload = json.loads(result.stdout)
              tasks_processed = int(payload.get("tasks_processed", 0))
              stop_reason = str(payload.get("stop_reason", "unknown"))
          except (ValueError, TypeError):
              payload = {}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tasks_processed={tasks_processed}\nstop_reason={stop_reason}\n")
          raise SystemExit(result.returncode)
          PY
      - name: Publish per-task outcomes
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.run_public_research_once)
        # Annotations and the step summary are readable through the checks API and
        # the run page; raw job logs are not. Always run, so a failed batch still
        # says which task failed and why.
        run: python -m engine.run_report /tmp/raawaa-batch.json /tmp/raawaa-batch.stderr

      - name: Publish bounded Task Runner status
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.run_public_research_once)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          HEALTH_STATUS: ${{ steps.health.outputs.status }}
          HEALTH_RAY: ${{ steps.health.outputs.ray }}
          AUTH_STATUS: ${{ steps.auth.outputs.status }}
          AUTH_RAY: ${{ steps.auth.outputs.ray }}
          BATCH_OUTCOME: ${{ steps.batch.outcome }}
          TASKS_PROCESSED: ${{ steps.batch.outputs.tasks_processed }}
          STOP_REASON: ${{ steps.batch.outputs.stop_reason }}
          MOBILE_STATUS_HTTP: ${{ steps.mobile.outputs.http }}
          MOBILE_PAPER_LEDGER: ${{ steps.mobile.outputs.paper_ledger }}
          MOBILE_PROVIDER_USAGE: ${{ steps.mobile.outputs.provider_usage }}
          MOBILE_LAST_SCAN: ${{ steps.mobile.outputs.last_scan }}
          MOBILE_SOURCE_FRESHNESS: ${{ steps.mobile.outputs.source_freshness }}
          MOBILE_CI_HEALTH: ${{ steps.mobile.outputs.ci_health }}
          MOBILE_KILL_SWITCH: ${{ steps.mobile.outputs.kill_switch }}
          MOBILE_TASKS_PENDING: ${{ steps.mobile.outputs.tasks_pending }}
          MOBILE_TASKS_RUNNING: ${{ steps.mobile.outputs.tasks_running }}
          MOBILE_TASK_EXECUTION_MODES: ${{ steps.mobile.outputs.task_execution_modes }}
          MOBILE_DRY_RUN_SUCCEEDED: ${{ steps.mobile.outputs.tasks_dry_run_succeeded }}
          MOBILE_LIVE_SUCCEEDED: ${{ steps.mobile.outputs.tasks_live_inference_succeeded }}
          MOBILE_UNKNOWN_SUCCEEDED: ${{ steps.mobile.outputs.tasks_unknown_succeeded }}
          MOBILE_PAPER_EVENTS: ${{ steps.mobile.outputs.paper_events }}
          MOBILE_WORKER_CRON_STATUS: ${{ steps.mobile.outputs.worker_cron_status }}
          MOBILE_WORKER_CRON_LAST_SEEN: ${{ steps.mobile.outputs.worker_cron_last_seen }}
          MOBILE_WORKER_CRON_SCHEDULE: ${{ steps.mobile.outputs.worker_cron_schedule }}
          MOBILE_WORKER_CRON_REQUEUED: ${{ steps.mobile.outputs.worker_cron_requeued }}
          MOBILE_WORKER_CRON_FAILED: ${{ steps.mobile.outputs.worker_cron_failed }}
          MOBILE_WATCHDOG_READY: ${{ steps.mobile.outputs.watchdog_ready }}
          MOBILE_WATCHDOG_MISSING: ${{ steps.mobile.outputs.watchdog_missing }}
          MOBILE_WATCHDOG_LAST_DISPATCH: ${{ steps.mobile.outputs.watchdog_last_dispatch_requested }}
          MOBILE_WATCHDOG_LAST_INTENT: ${{ steps.mobile.outputs.watchdog_last_dispatch_intent_at }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const marker = "<!-- raawaa-task-runner-status -->";
            const body = [
              marker,
              "## Latest bounded Task Runner status",
              "",
              "Run: " + context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId,
              "Job result: " + (process.env.JOB_STATUS || "unknown"),
              "Health GET: " + (process.env.HEALTH_STATUS || "unknown") + " (Ray " + (process.env.HEALTH_RAY || "not supplied") + ")",
              "Authenticated POST: " + (process.env.AUTH_STATUS || "unknown") + " (Ray " + (process.env.AUTH_RAY || "not supplied") + ")",
              "Batch step: " + (process.env.BATCH_OUTCOME || "not run"),
              "Tasks processed: " + (process.env.TASKS_PROCESSED || "unknown"),
              "Stop reason: " + (process.env.STOP_REASON || "unknown"),
              "D1 mobile status GET: " + (process.env.MOBILE_STATUS_HTTP || "not run"),
              "D1 paper ledger / quota ledger: " + (process.env.MOBILE_PAPER_LEDGER || "unknown") + " / " + (process.env.MOBILE_PROVIDER_USAGE || "unknown"),
              "D1 pending / running tasks: " + (process.env.MOBILE_TASKS_PENDING || "unknown") + " / " + (process.env.MOBILE_TASKS_RUNNING || "unknown"),
              "D1 execution modes: " + (process.env.MOBILE_TASK_EXECUTION_MODES || "unknown") +
                " · dry-run simulated successes: " + (process.env.MOBILE_DRY_RUN_SUCCEEDED || "unknown") +
                " · live-inference successes: " + (process.env.MOBILE_LIVE_SUCCEEDED || "unknown") +
                " · legacy/unknown successes: " + (process.env.MOBILE_UNKNOWN_SUCCEEDED || "unknown"),
              "D1 paper events: " + (process.env.MOBILE_PAPER_EVENTS || "unknown"),
              "Worker Cron heartbeat: " + (process.env.MOBILE_WORKER_CRON_STATUS || "unknown") +
                " · last seen: " + (process.env.MOBILE_WORKER_CRON_LAST_SEEN || "unknown") +
                " · schedule: " + (process.env.MOBILE_WORKER_CRON_SCHEDULE || "unknown") +
                " · stale leases requeued / failed: " +
                (process.env.MOBILE_WORKER_CRON_REQUEUED || "unknown") + " / " +
                (process.env.MOBILE_WORKER_CRON_FAILED || "unknown"),
              "Task Runner watchdog: " + (process.env.MOBILE_WATCHDOG_READY || "unknown") +
                " · missing settings: " + (process.env.MOBILE_WATCHDOG_MISSING || "unknown") +
                " · last dispatch: " + (process.env.MOBILE_WATCHDOG_LAST_DISPATCH || "unknown") +
                " · last intent: " + (process.env.MOBILE_WATCHDOG_LAST_INTENT || "unknown"),
              "Telemetry gaps — scan: " + (process.env.MOBILE_LAST_SCAN || "unknown") +
                "; source freshness: " + (process.env.MOBILE_SOURCE_FRESHNESS || "unknown") +
                "; CI: " + (process.env.MOBILE_CI_HEALTH || "unknown") +
                "; kill switch: " + (process.env.MOBILE_KILL_SWITCH || "unknown"),
              "",
              "The batch remains bounded; live inference and external writes remain governed by repository policy."
            ].join("\n");
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: 34, per_page: 100
            });
            const existing = comments.data.find(comment =>
              comment.body && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: 34, body
              });
            }

  run-specialist-lanes:
    if: github.ref == 'refs/heads/main' && github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: d1-specialist-lane-runner
      cancel-in-progress: false
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Run configured specialist consumers (bounded dry-run only)
        env:
          RAAWAA_ENGINE_API_URL: https://raawaa-autonomous-engine-control.ghith-shikhkhaled.workers.dev
          RAAWAA_ENGINE_API_TOKEN: ${{ secrets.ENGINE_API_TOKEN }}
          RAAWAA_ENGINE_QUOTA_ADMIN_TOKEN: ${{ secrets.ENGINE_QUOTA_ADMIN_TOKEN }}
          RAAWAA_ENGINE_CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          RAAWAA_ENGINE_CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          RAAWAA_ENGINE_RESEARCHER_LANE_TOKEN: ${{ secrets.ENGINE_RESEARCHER_LANE_TOKEN }}
          RAAWAA_ENGINE_REVIEWER_LANE_TOKEN: ${{ secrets.ENGINE_REVIEWER_LANE_TOKEN }}
          RAAWAA_ENGINE_MARKETER_LANE_TOKEN: ${{ secrets.ENGINE_MARKETER_LANE_TOKEN }}
          RAAWAA_ENGINE_OPERATOR_LANE_TOKEN: ${{ secrets.ENGINE_OPERATOR_LANE_TOKEN }}
          RAAWAA_ENGINE_MOBILE_TESTER_LANE_TOKEN: ${{ secrets.ENGINE_MOBILE_TESTER_LANE_TOKEN }}
        run: python scripts/run_specialist_lanes.py
