name: Apply D1 Migrations

on:
  workflow_dispatch:
    inputs:
      confirm_database:
        description: 'Type raawaa-autonomous-e to confirm the target D1 database'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: d1-migrations-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate explicit target confirmation
        env:
          CONFIRM_DATABASE: ${{ inputs.confirm_database }}
        run: |
          test "$CONFIRM_DATABASE" = "raawaa-autonomous-e" || {
            echo "Target confirmation did not match; refusing to run."
            exit 1
          }
      - name: Show remote migration status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.156.1 d1 migrations list raawaa-autonomous-e --remote --config wrangler.toml
      - name: Apply reviewed migrations to the confirmed D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.156.1 d1 migrations apply raawaa-autonomous-e --remote --config wrangler.toml
