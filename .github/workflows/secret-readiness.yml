name: Report which secrets are configured

# Answers one question — which repository secret names are present — without
# reading, printing or otherwise touching any value.
#
# It exists because the honest failure mode of a secret-gated workflow is a blind
# red X: "Validate required secrets" fails, and nobody can tell whether the token
# was never added, added under a different name, added as an environment secret,
# or added to a different repository. Each of those is a different fix.
#
# Booleans only. A secret that is present is reported as "present", never as its
# value or a prefix of it, and the step never writes a secret anywhere.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type REPORT_SECRET_READINESS to confirm"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: secret-readiness
  cancel-in-progress: false

jobs:
  report:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'REPORT_SECRET_READINESS'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report presence of each required secret name
        env:
          # Required for a working control plane.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENGINE_API_TOKEN: ${{ secrets.ENGINE_API_TOKEN }}
          # Optional: only needed once live inference is wanted.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -uo pipefail
          required_missing=0
          optional_missing=0

          check() {
            name="$1"; scope="$2"
            value="${!name:-}"
            if [ -n "$value" ]; then
              echo "::notice title=Secret present::$name is configured ($scope)."
            elif [ "$scope" = "required" ]; then
              echo "::error title=Missing repository secret::$name is not configured (required). Add it under Settings -> Secrets and variables -> Actions -> New repository secret."
              required_missing=$((required_missing + 1))
            else
              echo "::warning title=Optional secret absent::$name is not configured (optional)."
              optional_missing=$((optional_missing + 1))
            fi
          }

          check TELEGRAM_BOT_TOKEN required
          check CLOUDFLARE_API_TOKEN required
          check CLOUDFLARE_ACCOUNT_ID required
          check ENGINE_API_TOKEN required
          check GROQ_API_KEY optional
          check GEMINI_API_KEY optional

          {
            echo "### Secret readiness"
            echo ""
            echo "| secret | scope | configured |"
            echo "| --- | --- | --- |"
            for name in TELEGRAM_BOT_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ENGINE_API_TOKEN GROQ_API_KEY GEMINI_API_KEY; do
              value="${!name:-}"
              scope=required
              case "$name" in GROQ_API_KEY|GEMINI_API_KEY) scope=optional ;; esac
              [ -n "$value" ] && state=yes || state=no
              echo "| $name | $scope | $state |"
            done
            echo ""
            echo "Values are never read, logged or summarised — only presence."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "required_missing=$required_missing optional_missing=$optional_missing"
          [ "$required_missing" -eq 0 ] || {
            echo "::error title=Readiness incomplete::$required_missing required secret name(s) missing."
            exit 1
          }
