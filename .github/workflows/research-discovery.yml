name: Scheduled Open-Source Research Discovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/research-discovery.yml"
      - "engine/research_discovery.py"
      - "config/research_sources.json"
      - "scripts/persist_research_candidates.py"
      - "scripts/publish_research_scan_telemetry.py"
      - "worker/mobile-status.js"
      - "scripts/triage_research_candidates.py"
      - "scripts/analyze_capability_gaps.py"
      - "worker/index.js"
      - "migrations/**"
  schedule:
    - cron: "31 5 * * *"
  pull_request:
    paths:
      - ".github/workflows/research-discovery.yml"
      - ".graphifyignore"
      - "config/**"
      - "engine/**"
      - "worker/**"
      - "scripts/**"
      - "tests/**"
      - "docs/research/**"
      - "docs/research-and-development-operating-system.ar.md"

permissions:
  contents: read

concurrency:
  group: scheduled-research-discovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: d1-staging-worker-verification
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Validate engine policy
        run: python -m engine.cli audit
      - name: Record research scan start time
        id: scan_clock
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Discover public research candidates
        id: discover
        env:
          RAAWAA_SEARXNG_BASE_URL: ${{ vars.RAAWAA_SEARXNG_BASE_URL }}
        run: python -m engine.cli research-discover --max-per-query 5 > research-candidates.json
      - name: Rank candidates for manual review
        run: python scripts/triage_research_candidates.py research-candidates.json > research-triage.json
      - name: Analyze capability gaps from repository baseline
        run: python scripts/analyze_capability_gaps.py research-triage.json . > capability-gaps.json
      - name: Verify zero-cost boundary before Staging research writes
        id: research_zero_cost_preflight
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/verify_cloudflare_zero_cost_boundary.py
      - name: Upload bounded research snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: research-candidates-${{ github.run_id }}
          path: research-candidates.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload first-pass triage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: research-triage-${{ github.run_id }}
          path: research-triage.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload deterministic capability gap report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: capability-gaps-${{ github.run_id }}
          path: capability-gaps.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify idempotent research schema in isolated Staging D1
        id: research_schema
        if: steps.research_zero_cost_preflight.outputs.zero_cost_eligible == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/verify_research_persistence_schema.py
      - name: Generate ephemeral Staging research API token
        id: generate_staging_api_token
        if: steps.research_zero_cost_preflight.outputs.zero_cost_eligible == 'true' && steps.research_schema.outcome == 'success'
        run: |
          STAGING_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          echo "::add-mask::$STAGING_TOKEN"
          echo "RAAWAA_ENGINE_STAGING_API_TOKEN=$STAGING_TOKEN" >> "$GITHUB_ENV"
      - name: Install ephemeral Staging research API token
        id: install_staging_api_token
        if: steps.generate_staging_api_token.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$RAAWAA_ENGINE_STAGING_API_TOKEN"
          printf '%s' "$RAAWAA_ENGINE_STAGING_API_TOKEN" | npx --yes wrangler@4.156.1 secret put ENGINE_API_TOKEN --config wrangler.staging.toml
      - name: Persist public research metadata in isolated Staging Worker
        if: steps.install_staging_api_token.outcome == 'success'
        env:
          RAAWAA_ENGINE_API_URL: https://raawaa-autonomous-engine-staging.ghith-shikhkhaled.workers.dev
        run: python scripts/persist_research_candidates.py research-candidates.json
      - name: Revoke ephemeral Staging research API token
        if: always() && steps.install_staging_api_token.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.156.1 secret delete ENGINE_API_TOKEN --config wrangler.staging.toml
      - name: Publish explicit scan and source freshness telemetry to Staging D1
        if: always() && steps.scan_clock.outcome == 'success' && steps.discover.outcome == 'success' && steps.research_zero_cost_preflight.outputs.zero_cost_eligible == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          RESEARCH_SCAN_STARTED_AT: ${{ steps.scan_clock.outputs.started_at }}
        run: python scripts/publish_research_scan_telemetry.py research-candidates.json

  knowledge_graph:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Validate project and agent topology
        run: python scripts/validate_project_agent_map.py config/project-agent-map.json .
      - name: Test project map graph overlay
        run: python -m unittest tests.test_project_agent_map_merge -v
      - name: Install pinned Graphify OSS
        run: python -m pip install --disable-pip-version-check --no-input "graphifyy[sql]==0.9.103"
      - name: Build local code and project-agent knowledge graph (no model)
        env:
          GRAPHIFY_OUT: graphify-out
          GRAPHIFY_NO_TIPS: "1"
        run: |
          python -m graphify extract . --code-only
          python -m graphify cluster-only . --no-label
          python scripts/merge_project_agent_map.py --graph graphify-out/graph.json --map config/project-agent-map.json
          python - <<'PY'
          import json
          from pathlib import Path, PurePosixPath
          graph_path = Path("graphify-out/graph.json")
          report_path = Path("graphify-out/GRAPH_REPORT.md")
          if not graph_path.is_file() or not report_path.is_file():
              raise SystemExit("Graphify did not produce the expected graph and report")
          graph = json.loads(graph_path.read_text(encoding="utf-8"))
          manifest = json.loads(Path("config/project-agent-map.json").read_text(encoding="utf-8"))
          nodes = graph.get("nodes", [])
          links = graph.get("links", graph.get("edges", []))
          project_nodes = [n for n in nodes if isinstance(n, dict) and n.get("_origin") == "project_map" and n.get("file_type") == "project_map"]
          project_links = [e for e in links if isinstance(e, dict) and e.get("_origin") == "project_map"]
          if len(project_nodes) != len(manifest.get("nodes", [])):
              raise SystemExit(f"Project/agent topology nodes mismatch: {len(project_nodes)} != {len(manifest.get('nodes', []))}")
          if len(project_links) < len(manifest.get("edges", [])):
              raise SystemExit(f"Project/agent topology edges missing: {len(project_links)} < {len(manifest.get('edges', []))}")
          if not isinstance(nodes, list) or not nodes or not isinstance(links, list):
              raise SystemExit("Graphify produced an empty or invalid graph")
          for node in nodes:
              source = node.get("source_file") if isinstance(node, dict) else None
              if source:
                  path = PurePosixPath(str(source).replace("\\", "/"))
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Graphify emitted an unsafe source path: {source}")
          html_path = Path("graphify-out/graph.html")
          if not html_path.is_file():
              raise SystemExit("Graphify did not produce graph.html")
          # Preserve the full combined topology before any Graphify visualization transforms.
          Path("graphify-out/project-agent-graph.json").write_text(json.dumps(graph, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Combined graph validated: nodes={len(nodes)} links={len(links)} project_nodes={len(project_nodes)} project_links={len(project_links)} html_bytes={html_path.stat().st_size}")
          PY
      - name: Upload short-lived knowledge graph artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: project-knowledge-graph-${{ github.run_id }}
          path: |
            graphify-out/project-agent-graph.json
            graphify-out/graph.json
            graphify-out/graph.html
            graphify-out/GRAPH_REPORT.md
          if-no-files-found: error
          retention-days: 7
