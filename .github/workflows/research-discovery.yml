name: Scheduled Open-Source Research Discovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/research-discovery.yml"
      - "engine/research_discovery.py"
      - "config/research_sources.json"
      - "scripts/persist_research_candidates.py"
      - "scripts/publish_research_scan_telemetry.py"
      - "worker/mobile-status.js"
      - "scripts/triage_research_candidates.py"
      - "worker/index.js"
      - "migrations/**"
  schedule:
    - cron: "31 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-research-discovery
  cancel-in-progress: true

jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Validate engine policy
        run: python -m engine.cli audit
      - name: Record research scan start time
        id: scan_clock
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Discover public research candidates
        id: discover
        run: python -m engine.cli research-discover --max-per-query 5 > research-candidates.json
      - name: Rank candidates for manual review
        run: python scripts/triage_research_candidates.py research-candidates.json > research-triage.json
      - name: Upload bounded research snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: research-candidates-${{ github.run_id }}
          path: research-candidates.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload first-pass triage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: research-triage-${{ github.run_id }}
          path: research-triage.json
          if-no-files-found: error
          retention-days: 30
      - name: Persist research metadata in D1
        if: vars.RAAWAA_ENGINE_RESEARCH_PERSISTENCE == 'enabled'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/persist_research_candidates.py research-candidates.json

      - name: Publish explicit scan and source freshness telemetry
        if: always() && steps.scan_clock.outcome == 'success' && steps.discover.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAAWAA_ENGINE_API_URL: https://raawaa-autonomous-engine-control.ghith-shikhkhaled.workers.dev
          RAAWAA_ENGINE_API_TOKEN: ${{ secrets.ENGINE_API_TOKEN }}
          RAAWAA_ENGINE_CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          RAAWAA_ENGINE_CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          RESEARCH_SCAN_STARTED_AT: ${{ steps.scan_clock.outputs.started_at }}
        run: python scripts/publish_research_scan_telemetry.py research-candidates.json
