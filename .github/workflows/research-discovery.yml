name: Scheduled Open-Source Research Discovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/research-discovery.yml"
      - "engine/research_discovery.py"
      - "config/research_sources.json"
      - "scripts/persist_research_candidates.py"
      - "scripts/publish_research_scan_telemetry.py"
      - "worker/mobile-status.js"
      - "scripts/triage_research_candidates.py"
      - "scripts/analyze_capability_gaps.py"
      - "worker/index.js"
      - "migrations/**"
  schedule:
    - cron: "31 5 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/research-discovery.yml"
      - ".graphifyignore"
      - "config/**"
      - "engine/**"
      - "worker/**"
      - "scripts/**"
      - "tests/**"
      - "docs/research/**"
      - "docs/research-and-development-operating-system.ar.md"

permissions:
  contents: read

concurrency:
  group: scheduled-research-discovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Validate engine policy
        run: python -m engine.cli audit
      - name: Record research scan start time
        id: scan_clock
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Discover public research candidates
        id: discover
        env:
          RAAWAA_SEARXNG_BASE_URL: ${{ vars.RAAWAA_SEARXNG_BASE_URL }}
        run: python -m engine.cli research-discover --max-per-query 5 > research-candidates.json
      - name: Rank candidates for manual review
        run: python scripts/triage_research_candidates.py research-candidates.json > research-triage.json
      - name: Analyze capability gaps from repository baseline
        run: python scripts/analyze_capability_gaps.py research-triage.json . > capability-gaps.json
      - name: Upload bounded research snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: research-candidates-${{ github.run_id }}
          path: research-candidates.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload first-pass triage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: research-triage-${{ github.run_id }}
          path: research-triage.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload deterministic capability gap report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: capability-gaps-${{ github.run_id }}
          path: capability-gaps.json
          if-no-files-found: error
          retention-days: 30
      - name: Persist research metadata in D1
        if: vars.RAAWAA_ENGINE_RESEARCH_PERSISTENCE == 'enabled'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/persist_research_candidates.py research-candidates.json

      - name: Publish explicit scan and source freshness telemetry
        if: always() && steps.scan_clock.outcome == 'success' && steps.discover.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAAWAA_ENGINE_API_URL: https://raawaa-autonomous-engine-control.ghith-shikhkhaled.workers.dev
          RAAWAA_ENGINE_API_TOKEN: ${{ secrets.ENGINE_API_TOKEN }}
          RAAWAA_ENGINE_CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          RAAWAA_ENGINE_CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          RESEARCH_SCAN_STARTED_AT: ${{ steps.scan_clock.outputs.started_at }}
        run: python scripts/publish_research_scan_telemetry.py research-candidates.json

  knowledge_graph:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Validate project and agent topology
        run: python scripts/validate_project_agent_map.py config/project-agent-map.json .
      - name: Install pinned Graphify OSS
        run: python -m pip install --disable-pip-version-check --no-input "graphifyy[sql]==0.9.103"
      - name: Build local code and configuration knowledge graph (no model)
        env:
          GRAPHIFY_OUT: graphify-out
          GRAPHIFY_NO_TIPS: "1"
        run: |
          python -m graphify extract . --code-only
          python -m graphify cluster-only . --no-label
          python - <<'PY'
          import json
          from pathlib import Path
          graph_path = Path("graphify-out/graph.json")
          report_path = Path("graphify-out/GRAPH_REPORT.md")
          if not graph_path.is_file() or not report_path.is_file():
              raise SystemExit("Graphify did not produce the expected graph and report")
          graph = json.loads(graph_path.read_text(encoding="utf-8"))
          nodes = graph.get("nodes", [])
          edges = graph.get("edges", graph.get("links", []))
          if not isinstance(nodes, list) or not nodes:
              raise SystemExit("Graphify produced an empty or invalid node list")
          if not isinstance(edges, list):
              raise SystemExit("Graphify produced an invalid edge list")
          from pathlib import PurePosixPath
          for node in nodes:
              source = node.get("source_file") if isinstance(node, dict) else None
              if source:
                  path = PurePosixPath(str(source).replace("\\", "/"))
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Graphify emitted an unsafe source path: {source}")
          html_path = Path("graphify-out/graph.html")
          if not html_path.is_file():
              raise SystemExit("Graphify did not produce graph.html")
          print(f"Graphify artifact validated: nodes={len(nodes)} edges={len(edges)} html_bytes={html_path.stat().st_size}")
          PY
      - name: Upload short-lived knowledge graph artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: project-knowledge-graph-${{ github.run_id }}
          path: |
            graphify-out/graph.json
            graphify-out/graph.html
            graphify-out/GRAPH_REPORT.md
          if-no-files-found: error
          retention-days: 7
