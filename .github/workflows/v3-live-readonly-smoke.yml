name: V3 read-only live pool smoke

on:
  push:
    branches: [main]
    paths:
      - "projects/telegram-arbitrage-engine/src/arb_engine/v3_*.py"
      - "projects/telegram-arbitrage-engine/src/arb_engine/sqrt_price_math.py"
      - "projects/telegram-arbitrage-engine/src/arb_engine/swap_math.py"
      - "projects/telegram-arbitrage-engine/src/arb_engine/tick_bitmap.py"
      - "projects/telegram-arbitrage-engine/src/arb_engine/liquidity_math.py"
      - "scripts/v3_live_readonly_smoke.py"
      - ".github/workflows/v3-live-readonly-smoke.yml"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-live-readonly-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-readonly-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Install isolated package
        run: python -m pip install --no-deps -e ./projects/telegram-arbitrage-engine
      - name: Read and simulate the Ethereum USDC/WETH V3 pool (no transactions)
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/v3_live_readonly_smoke.py
