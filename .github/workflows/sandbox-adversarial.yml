name: Sandbox adversarial proof

# #440 asks for evidence that a real boundary exists around repository task code,
# and explicitly says a green ordinary CI run is not that evidence. This is the
# workflow that can produce it: an ephemeral VM, gVisor installed on it, and several independent
# probes that try to escape and report what they saw.
#
# Manual dispatch on purpose. It pulls an image and downloads gVisor, so it is not
# something to run on every push, and the image is fixed to one reviewed digest — a caller cannot supply arbitrary code.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RUN_SANDBOX_ESCAPE_PROOF to confirm"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sandbox-adversarial
  cancel-in-progress: false

jobs:
  prove:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'RUN_SANDBOX_ESCAPE_PROOF'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7

      - name: Install pinned gVisor and register it as a Docker runtime
        env:
          RUNSC_VERSION: "20261102.0"
          RUNSC_SUITE: "20261102"
          RUNSC_KEY_FINGERPRINT: "6F1DF85E3A71C24918E727D56C6D554E32BD943"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-transport-https ca-certificates curl gnupg
          curl -fsSL https://gvisor.dev/archive.key -o /tmp/gvisor-archive.key
          ACTUAL_FINGERPRINT="$(gpg --show-keys --with-colons /tmp/gvisor-archive.key | awk -F: '$1 == "fpr" {print toupper($10); exit}')"
          test "$ACTUAL_FINGERPRINT" = "$RUNSC_KEY_FINGERPRINT" || { echo "::error::gVisor archive signing key fingerprint mismatch"; exit 1; }
          sudo gpg --dearmor --output /usr/share/keyrings/gvisor-archive-keyring.gpg /tmp/gvisor-archive.key
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases $RUNSC_SUITE main" | sudo tee /etc/apt/sources.list.d/gvisor.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y "runsc=$RUNSC_VERSION"
          runsc --version | grep -F "release-$RUNSC_VERSION"
          sudo runsc install
          sudo systemctl restart docker
      - name: Prove the runtime is the one the contract asks for
        run: |
          docker info --format '{{json .Runtimes}}' | tee /tmp/runtimes.json
          grep -q '"runsc"' /tmp/runtimes.json || {
            echo "::error::runsc is not registered as a Docker runtime"
            exit 1
          }

      - name: Pull the sandbox image
        env:
          IMAGE: "python:3.12-slim@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159"
        run: docker pull "$IMAGE"

      - name: Run the escape probes
        env:
          IMAGE: "python:3.12-slim@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159"
        run: |
          RAAWAA_SANDBOX_LIVE=1 RAAWAA_SANDBOX_IMAGE="$IMAGE" \
            python3 -m unittest tests.adversarial.test_sandbox_escape -v

      - name: Summary
        if: always()
        env:
          IMAGE: "python:3.12-slim@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159"
        run: |
          {
            echo "### Sandbox escape proof"
            echo ""
            echo "- image: `$IMAGE`"
            echo "- runtime: runsc (gVisor) release-20261102.0, network none, read-only rootfs, cap-drop ALL, non-root"
            echo "- probes: host file/environment canaries, immutable source, bounded tmpfs, cgroup PID/memory/CPU limits, Docker socket, egress, root write"
            echo ""
            echo "A skipped or partially run probe is reported as a failure, never as containment."
          } >> "$GITHUB_STEP_SUMMARY"
